<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;text-align:center;padding:25px 15px}
.container{max-width:900px;margin:auto;padding:20px}
h2{margin-bottom:12px}
.pratos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.prato{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0002}
.prato img{width:100%;height:190px;object-fit:cover}
.info{padding:15px}
.descricao{color:#666;margin:8px 0}
.preco{font-size:20px;font-weight:bold;margin:12px 0}
button{border:0;border-radius:8px;padding:12px 15px;font-weight:bold;cursor:pointer}
.add{background:#111;color:#fff;width:100%}
.carrinho,.admin{background:#fff;padding:20px;border-radius:12px;margin-top:25px;box-shadow:0 3px 12px #0002}
.item{padding:10px 0;border-bottom:1px solid #eee}
.total{font-size:22px;font-weight:bold;margin:15px 0}
input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px}
textarea{min-height:80px}
.btn{background:#111;color:#fff;margin:4px}
.publicar{background:#168a32;color:#fff}
.excluir{background:#d00;color:#fff}
.escondido{display:none}
.adminItem{border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}
.verde{color:green;font-weight:bold}
.vermelho{color:red;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>🍽️ Pensão Sabor de Mel</h1>
<p>Cardápio e pedidos</p>
</header>

<div class="container">

<h2>Cardápio</h2>

<div id="pratos" class="pratos">
<p>Carregando...</p>
</div>

<div class="carrinho">

<h2>🛒 Seu pedido</h2>

<div id="itens">
Nenhum item adicionado.
</div>

<div class="total">
Total: R$ <span id="total">0,00</span>
</div>

<input id="nome" placeholder="Seu nome">

<input id="endereco" placeholder="Endereço de entrega">

<select id="pagamento">
<option value="">Forma de pagamento</option>
<option value="Pix">Pix</option>
<option value="Dinheiro">Dinheiro</option>
<option value="Cartão">Cartão</option>
</select>

<button class="btn" style="width:100%" onclick="enviarPedido()">
📱 Enviar pedido pelo WhatsApp
</button>

</div>

<div class="admin">

<h2>🔐 Área administrativa</h2>

<div id="login">

<input type="password" id="senha" placeholder="Senha">

<button class="btn" onclick="entrar()">
Entrar
</button>

</div>

<div id="painel" class="escondido">

<hr><br>

<h2>Adicionar prato</h2>

<input id="novoNome" placeholder="Nome do prato">

<textarea id="novaDescricao" placeholder="Descrição do prato"></textarea>

<input id="novoPreco" type="number" step="0.01" placeholder="Preço">

<input id="novaImagem" placeholder="URL da imagem">

<button class="btn" onclick="adicionar()">
➕ Adicionar prato
</button>

<br><br>

<h2>Gerenciar cardápio</h2>

<div id="adminPratos"></div>

<br>

<button class="excluir" onclick="sair()">
Sair
</button>

</div>
</div>

</div>

<script>

/* =========================================
   SUPABASE
   ========================================= */

const SUPABASE_URL =
"COLE_AQUI_SUA_PROJECT_URL";

const SUPABASE_KEY =
"COLE_AQUI_SUA_PUBLISHABLE_KEY";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   CONFIGURAÇÕES
   ========================================= */

const SENHA_ADMIN = "123456";

/* COLOQUE AQUI O WHATSAPP QUE RECEBERÁ OS PEDIDOS */
const WHATSAPP = "5521999999999";

let pratos = [];
let carrinho = [];


/* =========================================
   CARDÁPIO PÚBLICO
   ========================================= */

async function carregarCardapio(){

const {data,error} =
await supabaseClient
.from("refeicoes")
.select("*")
.eq("publicado",true)
.eq("disponivel",true)
.order("id",{ascending:true});

if(error){

console.error(error);

document.getElementById("pratos").innerHTML =
"<p>Não foi possível carregar o cardápio.</p>";

return;
}

pratos=data || [];

mostrarCardapio();

}


function mostrarCardapio(){

const area =
document.getElementById("pratos");

if(!pratos.length){

area.innerHTML =
"<p>Nenhum prato publicado no momento.</p>";

return;
}

area.innerHTML =
pratos.map(p=>`

<div class="prato">

${p.imagem ? `
<img src="${p.imagem}" alt="${p.nome}">
` : ""}

<div class="info">

<h3>${p.nome}</h3>

<div class="descricao">
${p.descricao || ""}
</div>

<div class="preco">
R$ ${Number(p.preco).toFixed(2).replace(".",",")}
</div>

<button class="add"
onclick="adicionarCarrinho(${p.id})">

Adicionar ao pedido

</button>

</div>

</div>

`).join("");

}


/* =========================================
   CARRINHO
   ========================================= */

function adicionarCarrinho(id){

const prato =
pratos.find(p=>p.id===id);

if(!prato)return;

carrinho.push(prato);

atualizarCarrinho();

}


function remover(index){

carrinho.splice(index,1);

atualizarCarrinho();

}


function atualizarCarrinho(){

const area =
document.getElementById("itens");

if(!carrinho.length){

area.innerHTML =
"Nenhum item adicionado.";

document.getElementById("total").innerText =
"0,00";

return;
}

let total=0;

area.innerHTML =
carrinho.map((p,i)=>{

total += Number(p.preco);

return `

<div class="item">

<b>${p.nome}</b>

— R$ ${Number(p.preco)
.toFixed(2)
.replace(".",",")}

<button onclick="remover(${i})">
❌
</button>

</div>

`;

}).join("");

document.getElementById("total").innerText =
total.toFixed(2).replace(".",",");

}


/* =========================================
   WHATSAPP
   ========================================= */

function enviarPedido(){

if(!carrinho.length){

alert("Adicione um prato ao pedido.");

return;
}

const nome =
document.getElementById("nome").value.trim();

const endereco =
document.getElementById("endereco").value.trim();

const pagamento =
document.getElementById("pagamento").value;

if(!nome){

alert("Digite seu nome.");

return;
}

if(!endereco){

alert("Digite seu endereço.");

return;
}

if(!pagamento){

alert("Escolha a forma de pagamento.");

return;
}

let total=0;

let texto =
"🍽️ *NOVO PEDIDO*%0A%0A";

texto +=
"👤 *Nome:* "+nome+"%0A";

texto +=
"📍 *Endereço:* "+endereco+"%0A";

texto +=
"💳 *Pagamento:* "+pagamento+"%0A%0A";

texto +=
"🛒 *Itens:*%0A";

carrinho.forEach(p=>{

total += Number(p.preco);

texto +=
"• "+p.nome+
" — R$ "+
Number(p.preco)
.toFixed(2)
.replace(".",",")+
"%0A";

});

texto +=
"%0A💰 *TOTAL: R$ "+
total.toFixed(2).replace(".",",")+
"*";

const url =
"https://wa.me/"+
WHATSAPP+
"?text="+texto;

window.open(url,"_blank");

}


/* =========================================
   LOGIN ADMIN
   ========================================= */

function entrar(){

const senha =
document.getElementById("senha").value;

if(senha !== SENHA_ADMIN){

alert("Senha incorreta.");

return;
}

document
.getElementById("login")
.classList.add("escondido");

document
.getElementById("painel")
.classList.remove("escondido");

carregarAdmin();

}


function sair(){

document
.getElementById("painel")
.classList.add("escondido");

document
.getElementById("login")
.classList.remove("escondido");

}


/* =========================================
   ADMIN
   ========================================= */

async function carregarAdmin(){

const {data,error} =
await supabaseClient
.from("refeicoes")
.select("*")
.order("id",{ascending:false});

if(error){

console.error(error);

alert("Erro ao carregar os pratos.");

return;
}

const area =
document.getElementById("adminPratos");

if(!data.length){

area.innerHTML =
"<p>Nenhum prato cadastrado.</p>";

return;
}

area.innerHTML =
data.map(p=>`

<div class="adminItem">

<h3>${p.nome}</h3>

<p>${p.descricao || ""}</p>

<p>
<strong>
R$ ${Number(p.preco).toFixed(2).replace(".",",")}
</strong>
</p>

<p class="${p.publicado ? "verde":"vermelho"}">

${p.publicado
? "🟢 PUBLICADO"
: "🔴 NÃO PUBLICADO"}

</p>

<button
class="publicar"
onclick="publicar(${p.id},${p.publicado})">

${p.publicado
? "Despublicar"
: "Publicar"}

</button>

<button
class="excluir"
onclick="excluirPrato(${p.id})">

Excluir

</button>

</div>

`).join("");

}


/* =========================================
   ADICIONAR
   ========================================= */

async function adicionar(){

const nome =
document.getElementById("novoNome").value.trim();

const descricao =
document.getElementById("novaDescricao").value.trim();

const preco =
document.getElementById("novoPreco").value;

const imagem =
document.getElementById("novaImagem").value.trim();

if(!nome || !preco){

alert("Preencha o nome e o preço.");

return;
}

const {error} =
await supabaseClient
.from("refeicoes")
.insert({

nome:nome,

descricao:descricao,

preco:Number(preco),

imagem:imagem,

disponivel:true,

publicado:false

});

if(error){

console.error(error);

alert("Erro ao adicionar.");

return;
}

document.getElementById("novoNome").value="";
document.getElementById("novaDescricao").value="";
document.getElementById("novoPreco").value="";
document.getElementById("novaImagem").value="";

alert("Prato adicionado. Agora clique em PUBLICAR.");

carregarAdmin();

}


/* =========================================
   PUBLICAR
   ========================================= */

async function publicar(id,estado){

const {error} =
await supabaseClient
.from("refeicoes")
.update({
publicado:!estado
})
.eq("id",id);

if(error){

console.error(error);

alert("Erro ao publicar.");

return;
}

carregarAdmin();

carregarCardapio();

}


/* =========================================
   EXCLUIR
   ========================================= */

async function excluirPrato(id){

if(!confirm("Excluir este prato?"))return;

const {error} =
await supabaseClient
.from("refeicoes")
.delete()
.eq("id",id);

if(error){

console.error(error);

alert("Erro ao excluir.");

return;
}

carregarAdmin();

carregarCardapio();

}


/* =========================================
   INICIAR
   ========================================= */

carregarCardapio();

</script>

</body>
</html>
