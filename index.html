<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#222
}
header{
  background:linear-gradient(135deg,#e60000,#ffcc00);
  color:white;
  padding:22px 15px;
  text-align:center
}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0}

.container{
  max-width:900px;
  margin:auto;
  padding:20px
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:bold
}

.adminBtn{
  background:#222;
  color:#fff;
  margin-top:12px
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001
}

.card h3{margin:0 0 8px}
.price{
  color:#e60000;
  font-weight:bold;
  font-size:18px
}

.buy{
  background:#e60000;
  color:white;
  width:100%;
  margin-top:10px
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px
}

.hidden{display:none}

.admin{
  background:#f5f5f5;
  padding:20px;
  border-radius:12px;
  margin-top:20px
}

.item{
  border:1px solid #ddd;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
  background:white
}

.item button{
  margin:4px 2px
}

.red{background:#e60000;color:#fff}
.yellow{background:#ffcc00;color:#222}
.dark{background:#222;color:#fff}

.total{
  font-size:22px;
  font-weight:bold;
  margin:15px 0
}

#status{
  padding:10px;
  margin-bottom:15px;
  border-radius:8px;
  display:none
}
</style>
</head>

<body>

<header>
  <h1 id="storeName">Meu Cardápio</h1>
  <p id="storeDescription">Faça seu pedido</p>
  <button class="adminBtn" onclick="openAdmin()">Área Administrativa</button>
</header>

<div class="container">

  <div id="status"></div>

  <!-- CARDÁPIO -->
  <section id="menuSection">
    <h2>🍽️ Cardápio</h2>
    <div id="menu"></div>
  </section>

  <!-- CARRINHO -->
  <section id="cartSection" class="hidden">
    <h2>🛒 Seu pedido</h2>
    <div id="cart"></div>

    <div class="total">
      Total: R$ <span id="total">0,00</span>
    </div>

    <button class="red" onclick="openCheckout()">Finalizar pedido</button>
  </section>

  <!-- CHECKOUT -->
  <section id="checkout" class="hidden">
    <div class="card">
      <h2>📦 Dados do pedido</h2>

      <label>Nome</label>
      <input id="customerName" placeholder="Seu nome">

      <label>Endereço</label>
      <textarea id="customerAddress" placeholder="Rua, número, bairro..."></textarea>

      <label>Forma de pagamento</label>
      <select id="payment">
        <option value="">Selecione</option>
        <option value="Pix">Pix</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Cartão">Cartão</option>
      </select>

      <label>Observação</label>
      <textarea id="observation" placeholder="Alguma observação?"></textarea>

      <button class="red" onclick="sendOrder()">Enviar pedido pelo WhatsApp</button>
      <button class="dark" onclick="closeCheckout()">Voltar</button>
    </div>
  </section>

  <!-- LOGIN ADM -->
  <section id="adminLogin" class="admin hidden">
    <h2>🔐 Área Administrativa</h2>

    <input type="password" id="adminPassword" placeholder="Senha">

    <button class="red" onclick="loginAdmin()">Entrar</button>
    <button class="dark" onclick="closeAdmin()">Voltar</button>
  </section>

  <!-- PAINEL ADM -->
  <section id="adminPanel" class="admin hidden">

    <h2>⚙️ Painel Administrativo</h2>

    <button class="dark" onclick="logoutAdmin()">Sair</button>

    <hr>

    <h3>Configurações da loja</h3>

    <input id="newStoreName" placeholder="Nome da loja">
    <input id="newDescription" placeholder="Descrição">

    <button class="yellow" onclick="saveStore()">Salvar informações</button>

    <hr>

    <h3>➕ Adicionar prato</h3>

    <input id="foodName" placeholder="Nome do prato">
    <input id="foodPrice" type="number" step="0.01" placeholder="Preço">
    <textarea id="foodDescription" placeholder="Descrição"></textarea>

    <button class="red" onclick="addFood()">Adicionar prato</button>

    <hr>

    <h3>🍽️ Pratos cadastrados</h3>

    <div id="adminFoods"></div>

    <hr>

    <h3>🔑 Alterar senha</h3>

    <input type="password" id="newPassword" placeholder="Nova senha">

    <button class="yellow" onclick="changePassword()">Alterar senha</button>

  </section>

</div>

<script>

/* =========================
   CONFIGURAÇÕES
========================= */

const SUPABASE_URL =
"https://dnrxkaikqmobsroqngix.supabase.co";

const SUPABASE_REST =
SUPABASE_URL + "/rest/v1";

/*
 COLOQUE AQUI A ANON KEY DO SUPABASE
*/
const SUPABASE_KEY = "COLE_SUA_ANON_KEY_AQUI";

/*
 COLOQUE AQUI O NÚMERO DO WHATSAPP
 SOMENTE NÚMEROS.
 EXEMPLO:
 5521999999999
*/
const WHATSAPP = "SEU_NUMERO_AQUI";


/* =========================
   DADOS LOCAIS
========================= */

let foods = JSON.parse(localStorage.getItem("foods") || "[]");

let cart = JSON.parse(localStorage.getItem("cart") || "[]");

let store = JSON.parse(
  localStorage.getItem("store") ||
  '{"name":"Meu Cardápio","description":"Faça seu pedido"}'
);

let password =
localStorage.getItem("adminPassword") || "1234";


/* =========================
   INICIALIZAÇÃO
========================= */

document.addEventListener("DOMContentLoaded", () => {

  document.getElementById("storeName").innerText =
    store.name;

  document.getElementById("storeDescription").innerText =
    store.description;

  document.getElementById("newStoreName").value =
    store.name;

  document.getElementById("newDescription").value =
    store.description;

  renderMenu();
  renderCart();

});


/* =========================
   STATUS
========================= */

function showStatus(text){

  const status =
    document.getElementById("status");

  status.innerText = text;
  status.style.display = "block";

  setTimeout(() => {
    status.style.display = "none";
  },3000);
}


/* =========================
   CARDÁPIO
========================= */

function renderMenu(){

  const menu =
    document.getElementById("menu");

  menu.innerHTML = "";

  if(foods.length === 0){

    menu.innerHTML =
      "<p>Nenhum prato cadastrado ainda.</p>";

    return;
  }

  foods.forEach(food => {

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `
      <h3>${escapeHTML(food.name)}</h3>

      <p>${escapeHTML(food.description || "")}</p>

      <div class="price">
        R$ ${Number(food.price).toFixed(2).replace(".",",")}
      </div>

      <button class="buy"
        onclick="addToCart(${food.id})">
        Adicionar ao pedido
      </button>
    `;

    menu.appendChild(div);

  });

}


/* =========================
   CARRINHO
========================= */

function addToCart(id){

  const food =
    foods.find(f => f.id === id);

  if(!food) return;

  cart.push(food);

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  renderCart();

  showStatus("Prato adicionado ao pedido!");
}


function removeFromCart(index){

  cart.splice(index,1);

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  renderCart();
}


function renderCart(){

  const section =
    document.getElementById("cartSection");

  const cartDiv =
    document.getElementById("cart");

  cartDiv.innerHTML = "";

  if(cart.length === 0){

    section.classList.add("hidden");

    document.getElementById("total").innerText =
      "0,00";

    return;
  }

  section.classList.remove("hidden");

  let total = 0;

  cart.forEach((item,index) => {

    total += Number(item.price);

    const div =
      document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <strong>${escapeHTML(item.name)}</strong>
      <br>
      R$ ${Number(item.price).toFixed(2).replace(".",",")}
      <br>
      <button class="red"
        onclick="removeFromCart(${index})">
        Remover
      </button>
    `;

    cartDiv.appendChild(div);

  });

  document.getElementById("total").innerText =
    total.toFixed(2).replace(".",",");

}


/* =========================
   CHECKOUT
========================= */

function openCheckout(){

  if(cart.length === 0){

    showStatus("Adicione algum prato primeiro.");

    return;
  }

  document.getElementById("checkout")
    .classList.remove("hidden");

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


function closeCheckout(){

  document.getElementById("checkout")
    .classList.add("hidden");

}


/* =========================
   WHATSAPP
========================= */

function sendOrder(){

  const name =
    document.getElementById("customerName").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const payment =
    document.getElementById("payment").value;

  const observation =
    document.getElementById("observation").value.trim();

  if(!name){

    alert("Digite seu nome.");

    return;
  }

  if(!address){

    alert("Digite seu endereço.");

    return;
  }

  if(!payment){

    alert("Escolha a forma de pagamento.");

    return;
  }

  let message =
    "🛵 *NOVO PEDIDO*%0A%0A";

  message +=
    "👤 *Nome:* " +
    encodeURIComponent(name) +
    "%0A";

  message +=
    "📍 *Endereço:* " +
    encodeURIComponent(address) +
    "%0A";

  message +=
    "💳 *Pagamento:* " +
    encodeURIComponent(payment) +
    "%0A%0A";

  message +=
    "🍽️ *PEDIDO:*%0A";

  let total = 0;

  cart.forEach(item => {

    total += Number(item.price);

    message +=
      "• " +
      encodeURIComponent(item.name) +
      " - R$ " +
      Number(item.price)
        .toFixed(2)
        .replace(".",",") +
      "%0A";

  });

  message +=
    "%0A💰 *TOTAL: R$ " +
    total.toFixed(2).replace(".",",") +
    "*%0A";

  if(observation){

    message +=
      "%0A📝 *Observação:* " +
      encodeURIComponent(observation);

  }

  const url =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    message;

  window.open(url,"_blank");

}


/* =========================
   ADMIN
========================= */

function openAdmin(){

  document.getElementById("menuSection")
    .classList.add("hidden");

  document.getElementById("cartSection")
    .classList.add("hidden");

  document.getElementById("checkout")
    .classList.add("hidden");

  document.getElementById("adminLogin")
    .classList.remove("hidden");

}


function closeAdmin(){

  document.getElementById("adminLogin")
    .classList.add("hidden");

  document.getElementById("adminPanel")
    .classList.add("hidden");

  document.getElementById("menuSection")
    .classList.remove("hidden");

  renderMenu();
  renderCart();

}


function loginAdmin(){

  const entered =
    document.getElementById("adminPassword").value;

  if(entered !== password){

    alert("Senha incorreta.");

    return;
  }

  document.getElementById("adminLogin")
    .classList.add("hidden");

  document.getElementById("adminPanel")
    .classList.remove("hidden");

  renderAdminFoods();

}


function logoutAdmin(){

  closeAdmin();

}


/* =========================
   ADICIONAR PRATO
========================= */

function addFood(){

  const name =
    document.getElementById("foodName")
      .value.trim();

  const price =
    parseFloat(
      document.getElementById("foodPrice").value
    );

  const description =
    document.getElementById("foodDescription")
      .value.trim();

  if(!name){

    alert("Digite o nome do prato.");

    return;
  }

  if(isNaN(price) || price <= 0){

    alert("Digite um preço válido.");

    return;
  }

  const food = {

    id:Date.now(),

    name:name,

    price:price,

    description:description

  };

  foods.push(food);

  localStorage.setItem(
    "foods",
    JSON.stringify(foods)
  );

  document.getElementById("foodName").value = "";
  document.getElementById("foodPrice").value = "";
  document.getElementById("foodDescription").value = "";

  renderMenu();
  renderAdminFoods();

  showStatus("Prato adicionado!");

}


/* =========================
   ADMIN PRATOS
========================= */

function renderAdminFoods(){

  const div =
    document.getElementById("adminFoods");

  div.innerHTML = "";

  if(foods.length === 0){

    div.innerHTML =
      "<p>Nenhum prato cadastrado.</p>";

    return;
  }

  foods.forEach(food => {

    const item =
      document.createElement("div");

    item.className = "item";

    item.innerHTML = `
      <strong>${escapeHTML(food.name)}</strong>
      <br>
      R$ ${Number(food.price).toFixed(2).replace(".",",")}
      <br>
      ${escapeHTML(food.description || "")}
      <br><br>

      <button class="red"
        onclick="deleteFood(${food.id})">
        Excluir
      </button>
    `;

    div.appendChild(item);

  });

}


function deleteFood(id){

  if(!confirm("Excluir este prato?")) return;

  foods =
    foods.filter(food => food.id !== id);

  localStorage.setItem(
    "foods",
    JSON.stringify(foods)
  );

  renderMenu();
  renderAdminFoods();

}


/* =========================
   LOJA
========================= */

function saveStore(){

  const name =
    document.getElementById("newStoreName")
      .value.trim();

  const description =
    document.getElementById("newDescription")
      .value.trim();

  if(!name){

    alert("Digite o nome da loja.");

    return;
  }

  store = {

    name:name,

    description:description

  };

  localStorage.setItem(
    "store",
    JSON.stringify(store)
  );

  document.getElementById("storeName")
    .innerText = name;

  document.getElementById("storeDescription")
    .innerText = description;

  showStatus("Informações salvas!");

}


/* =========================
   SENHA
========================= */

function changePassword(){

  const newPass =
    document.getElementById("newPassword")
      .value.trim();

  if(newPass.length < 4){

    alert("A senha precisa ter pelo menos 4 caracteres.");

    return;
  }

  password = newPass;

  localStorage.setItem(
    "adminPassword",
    password
  );

  document.getElementById("newPassword")
    .value = "";

  alert("Senha alterada com sucesso!");

}


/* =========================
   SEGURANÇA HTML
========================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
      </html>
