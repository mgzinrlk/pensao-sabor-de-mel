<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#222;
}
header{
    background:linear-gradient(90deg,#d71920,#ffcc00);
    color:#fff;
    text-align:center;
    padding:22px 15px;
}
header h1{margin:0;font-size:28px}
.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    min-height:100vh;
    padding:18px;
}
h2{
    color:#d71920;
    border-bottom:4px solid #ffcc00;
    padding-bottom:8px;
}
.card{
    background:#fff;
    border-radius:16px;
    padding:17px;
    margin:13px 0;
    box-shadow:0 3px 12px #0002;
}
.card h3{margin:0 0 8px}
.price{
    color:#d71920;
    font-weight:bold;
    font-size:19px;
}
button{
    border:0;
    border-radius:12px;
    padding:13px 17px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
.btn{
    width:100%;
    background:#d71920;
    color:#fff;
    margin-top:10px;
}
.yellow{background:#ffcc00;color:#111}
.red{background:#d71920;color:#fff}
.gray{background:#ddd}
input,select,textarea{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:16px;
}
textarea{min-height:90px}
.total{
    font-size:27px;
    font-weight:bold;
    color:#d71920;
    margin:20px 0;
}
.hidden{display:none!important}
.adminButton{
    position:fixed;
    right:12px;
    bottom:12px;
    background:#222;
    color:#fff;
    border-radius:50px;
    z-index:50;
}
.modal{
    position:fixed;
    inset:0;
    background:#0009;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:100;
}
.modalBox{
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
}
.itemAdmin{
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin:10px 0;
}
.itemAdmin button{
    margin:4px;
}
.qty{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
}
.qty span{
    min-width:35px;
    text-align:center;
    font-weight:bold;
}
.close{
    float:right;
    background:#eee;
}
.small{
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<header>
    <h1>🍽️ CARDÁPIO</h1>
</header>

<div class="container">

    <!-- QUENTINHAS -->
    <h2>🥡 Quentinhas</h2>

    <div id="quentinhas"></div>

    <!-- BEBIDAS -->
    <h2>🥤 Bebidas</h2>

    <div id="bebidas"></div>

    <!-- PEDIDO -->
    <h2>🛒 Seu pedido</h2>

    <div id="carrinho">
        <p>Nenhum item adicionado.</p>
    </div>

    <div class="total">
        Total: R$ <span id="total">0,00</span>
    </div>

    <!-- DADOS SÓ NO FECHAMENTO -->
    <h2>📋 Dados do pedido</h2>

    <input id="nome" placeholder="Nome">

    <input id="endereco" placeholder="Endereço">

    <textarea id="observacao"
        placeholder="Observação do pedido"></textarea>

    <select id="pagamento">
        <option value="">Forma de pagamento</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Pix">Pix</option>
        <option value="Cartão">Cartão</option>
    </select>

    <button class="btn" onclick="enviarPedido()">
        📲 CONFIRMAR PEDIDO PELO WHATSAPP
    </button>

</div>

<button class="adminButton" onclick="abrirLogin()">
    ⚙️ ADM
</button>


<!-- LOGIN -->
<div id="loginModal" class="modal hidden">

    <div class="modalBox">

        <button class="close" onclick="fecharLogin()">✕</button>

        <h2>🔐 Área Administrativa</h2>

        <input
            id="senha"
            type="password"
            placeholder="Senha">

        <button class="btn" onclick="login()">
            ENTRAR
        </button>

    </div>

</div>


<!-- ADM -->
<div id="adminModal" class="modal hidden">

    <div class="modalBox">

        <button class="close" onclick="fecharAdm()">✕</button>

        <h2>⚙️ Painel ADM</h2>

        <h3>🥡 Quentinhas</h3>

        <div class="itemAdmin">
            <strong>Quentinha Pequena</strong>

            <input id="peqNome">
            <input id="peqPreco" type="number" step="0.01">
        </div>

        <div class="itemAdmin">
            <strong>Quentinha Grande</strong>

            <input id="graNome">
            <input id="graPreco" type="number" step="0.01">
        </div>

        <div class="itemAdmin">
            <strong>Quentinha Promoção</strong>

            <input id="proNome">
            <input id="proPreco" type="number" step="0.01">
        </div>

        <button class="btn" onclick="salvarQuentinhas()">
            💾 SALVAR QUENTINHAS
        </button>


        <h3>🥤 Nova bebida</h3>

        <input
            id="bebidaNome"
            placeholder="Nome da bebida">

        <input
            id="bebidaPreco"
            type="number"
            step="0.01"
            placeholder="Preço">

        <button class="btn" onclick="adicionarBebida()">
            ➕ CADASTRAR BEBIDA
        </button>


        <h3>🥤 Bebidas cadastradas</h3>

        <div id="listaAdmin"></div>


        <button class="btn" onclick="fecharAdm()">
            SAIR
        </button>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const WHATSAPP = "5521974967664";

const SENHA_ADM = "1234";


/* =====================================================
   DADOS
===================================================== */

let quentinhas =
JSON.parse(localStorage.getItem("quentinhas")) || {

    pequena:{
        nome:"Quentinha Pequena",
        preco:18
    },

    grande:{
        nome:"Quentinha Grande",
        preco:21
    },

    promocao:{
        nome:"Quentinha Promoção",
        preco:10
    }

};


let bebidas =
JSON.parse(localStorage.getItem("bebidas")) || [

    {id:1,nome:"Coca Cola 2LT",preco:15},

    {id:2,nome:"Fanta Laranja 2LT",preco:12},

    {id:3,nome:"Tobi 2LT",preco:7},

    {id:4,nome:"Coca Cola Lata",preco:6},

    {id:5,nome:"Guaraná Antarctica Lata",preco:6},

    {id:6,nome:"Fanta Laranja Lata",preco:6},

    {id:7,nome:"Coca Cola 600 ML",preco:8},

    {id:8,nome:"Ativ Plus Uva",preco:0}

];


let carrinho=[];


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor){

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   QUENTINHAS NA TELA
===================================================== */

function mostrarQuentinhas(){

    const area =
        document.getElementById("quentinhas");

    area.innerHTML="";

    Object.keys(quentinhas).forEach(chave=>{

        const q=quentinhas[chave];

        const div=document.createElement("div");

        div.className="card";

        div.innerHTML=`

            <h3>${q.nome}</h3>

            <div class="price">
                R$ ${dinheiro(q.preco)}
            </div>

            <button
                class="btn"
                onclick="addQuentinha('${chave}')">

                ADICIONAR

            </button>
        `;

        area.appendChild(div);

    });

}


/* =====================================================
   ADICIONAR QUENTINHA
===================================================== */

function addQuentinha(chave){

    const q=quentinhas[chave];

    let item=carrinho.find(
        x =>
        x.tipo==="quentinha" &&
        x.chave===chave
    );

    if(item){

        item.quantidade++;

    }else{

        carrinho.push({

            tipo:"quentinha",

            chave:chave,

            nome:q.nome,

            preco:Number(q.preco),

            quantidade:1

        });

    }

    mostrarCarrinho();

}


/* =====================================================
   BEBIDAS
===================================================== */

function mostrarBebidas(){

    const area =
        document.getElementById("bebidas");

    area.innerHTML="";

    bebidas.forEach(b=>{

        const div=document.createElement("div");

        div.className="card";

        let precoTexto =
            Number(b.preco)>0
            ? `R$ ${dinheiro(b.preco)}`
            : "Preço não cadastrado";

        div.innerHTML=`

            <h3>${b.nome}</h3>

            <div class="price">
                ${precoTexto}
            </div>

            <button
                class="btn"
                onclick="addBebida(${b.id})">

                ADICIONAR

            </button>

        `;

        area.appendChild(div);

    });

}


/* =====================================================
   ADICIONAR BEBIDA
===================================================== */

function addBebida(id){

    const b =
        bebidas.find(x=>x.id===id);

    if(!b)return;

    if(Number(b.preco)<=0){

        alert(
            "Essa bebida ainda não possui preço. " +
            "Cadastre o valor no ADM."
        );

        return;

    }

    let item=carrinho.find(
        x =>
        x.tipo==="bebida" &&
        x.id===id
    );

    if(item){

        item.quantidade++;

    }else{

        carrinho.push({

            tipo:"bebida",

            id:b.id,

            nome:b.nome,

            preco:Number(b.preco),

            quantidade:1

        });

    }

    mostrarCarrinho();

}


/* =====================================================
   CARRINHO
===================================================== */

function mostrarCarrinho(){

    const area =
        document.getElementById("carrinho");

    area.innerHTML="";

    if(carrinho.length===0){

        area.innerHTML =
            "<p>Nenhum item adicionado.</p>";

        document.getElementById("total")
            .innerText="0,00";

        return;

    }

    let total=0;

    carrinho.forEach((item,index)=>{

        const subtotal =
            item.preco *
            item.quantidade;

        total+=subtotal;

        const div =
            document.createElement("div");

        div.className="card";

        div.innerHTML=`

            <h3>${item.nome}</h3>

            <div>
                R$ ${dinheiro(item.preco)}
                cada
            </div>

            <div class="qty">

                <button
                    class="yellow"
                    onclick="mais(${index})">
                    +
                </button>

                <span>
                    ${item.quantidade}
                </span>

                <button
                    class="gray"
                    onclick="menos(${index})">
                    −
                </button>

                <button
                    class="red"
                    onclick="remover(${index})">
                    🗑️
                </button>

            </div>

            <div class="price">
                Subtotal:
                R$ ${dinheiro(subtotal)}
            </div>

        `;

        area.appendChild(div);

    });

    document.getElementById("total")
        .innerText=dinheiro(total);

}


/* =====================================================
   QUANTIDADE
===================================================== */

function mais(index){

    carrinho[index].quantidade++;

    mostrarCarrinho();

}


function menos(index){

    carrinho[index].quantidade--;

    if(carrinho[index].quantidade<=0){

        carrinho.splice(index,1);

    }

    mostrarCarrinho();

}


function remover(index){

    carrinho.splice(index,1);

    mostrarCarrinho();

}


/* =====================================================
   TOTAL
===================================================== */

function totalPedido(){

    return carrinho.reduce(

        (total,item)=>
            total +
            item.preco *
            item.quantidade,

        0

    );

}


/* =====================================================
   WHATSAPP
===================================================== */

function enviarPedido(){

    if(carrinho.length===0){

        alert(
            "Adicione uma quentinha ou bebida."
        );

        return;

    }

    const nome =
        document.getElementById("nome")
        .value.trim();

    const endereco =
        document.getElementById("endereco")
        .value.trim();

    const observacao =
        document.getElementById("observacao")
        .value.trim();

    const pagamento =
        document.getElementById("pagamento")
        .value;

    if(!nome){

        alert("Digite seu nome.");

        return;

    }

    if(!endereco){

        alert("Digite seu endereço.");

        return;

    }

    if(!pagamento){

        alert("Escolha a forma de pagamento.");

        return;

    }


    let texto =
`🍽️ *NOVO PEDIDO*

👤 Nome: ${nome}
📍 Endereço: ${endereco}

🛒 *PEDIDO:*
`;


    carrinho.forEach(item=>{

        texto +=
`• ${item.nome} x${item.quantidade} — R$ ${dinheiro(item.preco * item.quantidade)}
`;

    });


    texto +=
`
💰 *TOTAL: R$ ${dinheiro(totalPedido())}*
💳 Pagamento: ${pagamento}
`;


    if(observacao){

        texto +=
`\n📝 Observação: ${observacao}`;

    }


    texto +=
`\n\n✅ Pedido confirmado!`;


    const url =
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(texto);


    window.location.href=url;

}


/* =====================================================
   ADM
===================================================== */

function abrirLogin(){

    document
        .getElementById("loginModal")
        .classList.remove("hidden");

}


function fecharLogin(){

    document
        .getElementById("loginModal")
        .classList.add("hidden");

}


function login(){

    const senha =
        document.getElementById("senha")
        .value;

    if(senha!==SENHA_ADM){

        alert("Senha incorreta.");

        return;

    }

    fecharLogin();

    abrirAdm();

}


function abrirAdm(){

    document
        .getElementById("adminModal")
        .classList.remove("hidden");

    carregarAdm();

}


function fecharAdm(){

    document
        .getElementById("adminModal")
        .classList.add("hidden");

}


/* =====================================================
   CARREGAR ADM
===================================================== */

function carregarAdm(){

    document.getElementById("peqNome").value =
        quentinhas.pequena.nome;

    document.getElementById("peqPreco").value =
        quentinhas.pequena.preco;

    document.getElementById("graNome").value =
        quentinhas.grande.nome;

    document.getElementById("graPreco").value =
        quentinhas.grande.preco;

    document.getElementById("proNome").value =
        quentinhas.promocao.nome;

    document.getElementById("proPreco").value =
        quentinhas.promocao.preco;

    mostrarAdminBebidas();

}


/* =====================================================
   SALVAR QUENTINHAS
===================================================== */

function salvarQuentinhas(){

    quentinhas.pequena={

        nome:
            document.getElementById("peqNome")
            .value.trim(),

        preco:
            Number(
                document.getElementById("peqPreco")
                .value
            )

    };


    quentinhas.grande={

        nome:
            document.getElementById("graNome")
            .value.trim(),

        preco:
            Number(
                document.getElementById("graPreco")
                .value
            )

    };


    quentinhas.promocao={

        nome:
            document.getElementById("proNome")
            .value.trim(),

        preco:
            Number(
                document.getElementById("proPreco")
                .value
            )

    };


    localStorage.setItem(
        "quentinhas",
        JSON.stringify(quentinhas)
    );


    mostrarQuentinhas();

    alert("Quentinhas salvas!");

}


/* =====================================================
   CADASTRAR BEBIDA
===================================================== */

function adicionarBebida(){

    const nome =
        document.getElementById("bebidaNome")
        .value.trim();

    const preco =
        Number(
            document.getElementById("bebidaPreco")
            .value
        );


    if(!nome){

        alert("Digite o nome da bebida.");

        return;

    }


    if(preco<=0){

        alert("Digite um preço válido.");

        return;

    }


    bebidas.push({

        id:Date.now(),

        nome:nome,

        preco:preco

    });


    salvarBebidas();

    mostrarBebidas();

    mostrarAdminBebidas();


    document.getElementById("bebidaNome")
        .value="";

    document.getElementById("bebidaPreco")
        .value="";


    alert("Bebida cadastrada!");

}


/* =====================================================
   EDITAR BEBIDA
===================================================== */

function editarBebida(id){

    const b =
        bebidas.find(x=>x.id===id);

    if(!b)return;


    const nome =
        prompt(
            "Nome da bebida:",
            b.nome
        );

    if(nome===null)return;


    const preco =
        prompt(
            "Preço:",
            b.preco
        );

    if(preco===null)return;


    b.nome =
        nome.trim() || b.nome;

    b.preco =
        Number(preco);


    salvarBebidas();

    mostrarBebidas();

    mostrarAdminBebidas();

}


/* =====================================================
   EXCLUIR BEBIDA
===================================================== */

function excluirBebida(id){

    if(!confirm(
        "Excluir esta bebida?"
    ))return;


    bebidas =
        bebidas.filter(
            b=>b.id!==id
        );


    salvarBebidas();

    mostrarBebidas();

    mostrarAdminBebidas();

}


/* =====================================================
   SALVAR BEBIDAS
===================================================== */

function salvarBebidas(){

    localStorage.setItem(
        "bebidas",
        JSON.stringify(bebidas)
    );

}


/* =====================================================
   BEBIDAS NO ADM
===================================================== */

function mostrarAdminBebidas(){

    const area =
        document.getElementById("listaAdmin");

    area.innerHTML="";


    bebidas.forEach(b=>{

        const div =
            document.createElement("div");

        div.className="itemAdmin";


        div.innerHTML=`

            <strong>${b.nome}</strong>

            <p>
                R$ ${dinheiro(b.preco)}
            </p>

            <button
                class="yellow"
                onclick="editarBebida(${b.id})">
                ✏️ EDITAR
            </button>

            <button
                class="red"
                onclick="excluirBebida(${b.id})">
                🗑️ EXCLUIR
            </button>

        `;


        area.appendChild(div);

    });

}


/* =====================================================
   INICIAR
===================================================== */

mostrarQuentinhas();
mostrarBebidas();
mostrarCarrinho();

</script>

</body>
</html>
