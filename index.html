<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio - Sabor de Mel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8e8;
  color:#222
}
header{
  background:linear-gradient(135deg,#d71920,#ffca05);
  color:white;
  padding:22px 15px;
  text-align:center;
  box-shadow:0 3px 10px #0003
}
header h1{margin:0;font-size:30px}
header p{margin:6px 0 0;font-weight:bold}

.container{
  max-width:900px;
  margin:auto;
  padding:18px
}

.admin-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#222;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-bottom:18px;
  cursor:pointer
}

h2{
  color:#d71920;
  border-bottom:3px solid #ffca05;
  padding-bottom:8px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:14px
}

.card{
  background:white;
  border-radius:15px;
  padding:16px;
  box-shadow:0 2px 9px #0002
}

.card h3{margin:0 0 8px}
.price{
  color:#d71920;
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px
}

button{
  cursor:pointer
}

.add{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  background:#d71920;
  color:white;
  font-weight:bold;
  font-size:15px
}

.cart{
  position:fixed;
  bottom:15px;
  right:15px;
  left:15px;
  max-width:500px;
  margin:auto;
  background:#ffca05;
  color:#111;
  border:0;
  border-radius:14px;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 4px 15px #0004;
  z-index:10
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20;
  overflow:auto;
  padding:15px
}

.modal-box{
  background:white;
  max-width:650px;
  margin:30px auto;
  padding:20px;
  border-radius:18px
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  margin:6px 0 12px;
  font-size:15px
}

.primary{
  background:#d71920;
  color:white;
  border:0;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
  width:100%
}

.yellow{
  background:#ffca05;
  color:#111;
  border:0;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
  width:100%
}

.close{
  float:right;
  border:0;
  background:#ddd;
  border-radius:8px;
  padding:8px 12px
}

.admin-item{
  display:flex;
  gap:8px;
  align-items:center;
  background:#fff8e8;
  padding:10px;
  border-radius:10px;
  margin:8px 0
}

.admin-item span{
  flex:1
}

.small{
  padding:8px 10px;
  border:0;
  border-radius:7px
}

.delete{background:#d71920;color:white}
.edit{background:#ffca05}

.hidden{display:none}
.total{
  font-size:21px;
  font-weight:bold;
  color:#d71920;
  margin:15px 0
}
</style>
</head>

<body>

<header>
  <h1>🍛 Sabor de Mel</h1>
  <p>Cardápio do dia</p>
</header>

<div class="container">

  <!-- BOTÃO ADM NA TELA INICIAL -->
  <button class="admin-btn" onclick="abrirLogin()">
    🔐 ENTRAR NA ÁREA ADMINISTRATIVA
  </button>

  <h2>🍛 Comidas</h2>
  <div id="comidas" class="grid"></div>

  <h2>🥤 Bebidas</h2>
  <div id="bebidas" class="grid"></div>

</div>

<button class="cart" onclick="abrirCarrinho()">
  🛒 Ver meu pedido (<span id="qtdCarrinho">0</span>)
</button>

<!-- LOGIN ADM -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <button class="close" onclick="fechar('loginModal')">✕</button>
    <h2>🔐 Área Administrativa</h2>

    <label>Senha</label>
    <input type="password" id="senhaLogin" placeholder="Digite a senha">

    <button class="primary" onclick="entrarAdm()">ENTRAR</button>
  </div>
</div>

<!-- ADM -->
<div class="modal" id="admModal">
  <div class="modal-box">
    <button class="close" onclick="fechar('admModal')">✕</button>

    <h2>⚙️ Painel Administrativo</h2>

    <button class="yellow" onclick="mostrarSecao('comidaSecao')">
      🍛 EDITAR COMIDAS
    </button>

    <br><br>

    <button class="yellow" onclick="mostrarSecao('bebidaSecao')">
      🥤 CADASTRAR / EDITAR BEBIDAS
    </button>

    <br><br>

    <button class="yellow" onclick="mostrarSecao('senhaSecao')">
      🔑 ALTERAR SENHA
    </button>

    <!-- COMIDAS -->
    <div id="comidaSecao" class="hidden">

      <h2>🍛 Comidas</h2>

      <input id="nomeComida" placeholder="Nome da comida">
      <input id="precoComida" type="number" step="0.01" placeholder="Preço">

      <button class="primary" onclick="salvarComida()">
        ➕ CADASTRAR COMIDA
      </button>

      <div id="listaComidasAdm"></div>
    </div>

    <!-- BEBIDAS -->
    <div id="bebidaSecao" class="hidden">

      <h2>🥤 Bebidas</h2>

      <p>
        Aqui você pode cadastrar <b>quantas bebidas quiser</b> e mudar os
        preços quando quiser.
      </p>

      <input id="nomeBebida" placeholder="Nome da bebida">
      <input id="precoBebida" type="number" step="0.01" placeholder="Preço">

      <button class="primary" onclick="salvarBebida()">
        ➕ CADASTRAR BEBIDA
      </button>

      <div id="listaBebidasAdm"></div>
    </div>

    <!-- SENHA -->
    <div id="senhaSecao" class="hidden">

      <h2>🔑 Alterar senha</h2>

      <input id="senhaNova" type="password" placeholder="Nova senha">

      <button class="primary" onclick="alterarSenha()">
        SALVAR NOVA SENHA
      </button>
    </div>

  </div>
</div>

<!-- CARRINHO -->
<div class="modal" id="carrinhoModal">
  <div class="modal-box">
    <button class="close" onclick="fechar('carrinhoModal')">✕</button>

    <h2>🛒 Meu Pedido</h2>

    <div id="itensCarrinho"></div>

    <div class="total">
      Total: R$ <span id="totalPedido">0,00</span>
    </div>

    <h2>📋 Seus dados</h2>

    <input id="clienteNome" placeholder="Seu nome">
    <input id="clienteEndereco" placeholder="Endereço">
    <textarea id="observacao" placeholder="Observação do pedido"></textarea>

    <label>Forma de pagamento</label>
    <select id="pagamento">
      <option value="Dinheiro">Dinheiro</option>
      <option value="Cartão">Cartão</option>
      <option value="Pix">Pix</option>
    </select>

    <button class="primary" onclick="enviarWhatsApp()">
      📱 CONFIRMAR E ENVIAR PELO WHATSAPP
    </button>

  </div>
</div>

<script>
/* ============================
   DADOS
============================ */

let comidas = JSON.parse(localStorage.getItem("comidasSaborMel")) || [
  {id:1,nome:"Quentinha Pequena",preco:18},
  {id:2,nome:"Quentinha Grande",preco:21},
  {id:3,nome:"Promoção Quentinha",preco:10}
];

let bebidas = JSON.parse(localStorage.getItem("bebidasSaborMel")) || [
  {id:1,nome:"Coca-Cola 2LT",preco:15},
  {id:2,nome:"Fanta Laranja 2LT",preco:12},
  {id:3,nome:"Tobi 2LT",preco:7},
  {id:4,nome:"Coca-Cola Lata",preco:6},
  {id:5,nome:"Guaraná Antarctica Lata",preco:6},
  {id:6,nome:"Fanta Laranja Lata",preco:6},
  {id:7,nome:"Coca-Cola 600 ML",preco:8},
  {id:8,nome:"Ativ Plus Uva",preco:0}
];

let carrinho = JSON.parse(localStorage.getItem("carrinhoSaborMel")) || [];

let senhaAdm = localStorage.getItem("senhaSaborMel") || "1234";


/* ============================
   SALVAR
============================ */

function salvarDados(){
  localStorage.setItem("comidasSaborMel",JSON.stringify(comidas));
  localStorage.setItem("bebidasSaborMel",JSON.stringify(bebidas));
  localStorage.setItem("carrinhoSaborMel",JSON.stringify(carrinho));
}


/* ============================
   TELA
============================ */

function dinheiro(valor){
  return Number(valor).toFixed(2).replace(".",",");
}

function renderizar(){

  const comidasDiv=document.getElementById("comidas");
  const bebidasDiv=document.getElementById("bebidas");

  comidasDiv.innerHTML="";
  bebidasDiv.innerHTML="";

  comidas.forEach(item=>{
    comidasDiv.innerHTML+=`
      <div class="card">
        <h3>${esc(item.nome)}</h3>
        <div class="price">R$ ${dinheiro(item.preco)}</div>
        <button class="add" onclick="adicionar(${item.id},'comida')">
          ➕ ADICIONAR AO PEDIDO
        </button>
      </div>
    `;
  });

  bebidas.forEach(item=>{
    bebidasDiv.innerHTML+=`
      <div class="card">
        <h3>🥤 ${esc(item.nome)}</h3>
        <div class="price">
          ${Number(item.preco)>0 ? "R$ "+dinheiro(item.preco) : "Preço não informado"}
        </div>

        <button class="add"
          onclick="adicionar(${item.id},'bebida')">
          ➕ ADICIONAR AO PEDIDO
        </button>
      </div>
    `;
  });

  atualizarCarrinho();
}


/* ============================
   CARRINHO
============================ */

function adicionar(id,tipo){

  let lista=tipo==="comida"?comidas:bebidas;
  let produto=lista.find(x=>x.id===id);

  if(!produto)return;

  if(Number(produto.preco)<=0){
    alert("Essa bebida ainda não tem preço cadastrado. Entre no ADM e coloque o valor.");
    return;
  }

  let existente=carrinho.find(
    x=>x.id===id && x.tipo===tipo
  );

  if(existente){
    existente.quantidade++;
  }else{
    carrinho.push({
      id:produto.id,
      tipo:tipo,
      nome:produto.nome,
      preco:Number(produto.preco),
      quantidade:1
    });
  }

  salvarDados();
  atualizarCarrinho();

  alert("Produto adicionado ao pedido!");
}

function atualizarCarrinho(){

  let quantidade=carrinho.reduce(
    (total,item)=>total+item.quantidade,0
  );

  document.getElementById("qtdCarrinho").textContent=quantidade;
}

function abrirCarrinho(){

  document.getElementById("carrinhoModal").style.display="block";

  const div=document.getElementById("itensCarrinho");

  if(carrinho.length===0){
    div.innerHTML="<p>Seu pedido está vazio.</p>";
    document.getElementById("totalPedido").textContent="0,00";
    return;
  }

  let total=0;

  div.innerHTML="";

  carrinho.forEach((item,index)=>{

    let subtotal=item.preco*item.quantidade;
    total+=subtotal;

    div.innerHTML+=`
      <div class="card">
        <b>${esc(item.nome)}</b><br>
        Quantidade: ${item.quantidade}<br>
        R$ ${dinheiro(subtotal)}

        <br><br>

        <button class="small edit"
          onclick="alterarQuantidade(${index},1)">+</button>

        <button class="small"
          onclick="alterarQuantidade(${index},-1)">−</button>

        <button class="small delete"
          onclick="removerCarrinho(${index})">Excluir</button>
      </div>
    `;
  });

  document.getElementById("totalPedido").textContent=dinheiro(total);
}

function alterarQuantidade(index,valor){

  carrinho[index].quantidade+=valor;

  if(carrinho[index].quantidade<=0){
    carrinho.splice(index,1);
  }

  salvarDados();
  atualizarCarrinho();
  abrirCarrinho();
}

function removerCarrinho(index){

  carrinho.splice(index,1);

  salvarDados();
  atualizarCarrinho();
  abrirCarrinho();
}


/* ============================
   ADM LOGIN
============================ */

function abrirLogin(){
  document.getElementById("loginModal").style.display="block";
}

function entrarAdm(){

  let senha=document.getElementById("senhaLogin").value;

  if(senha===senhaAdm){

    fechar("loginModal");

    document.getElementById("admModal").style.display="block";

    atualizarListasAdm();

  }else{
    alert("Senha incorreta!");
  }
}


/* ============================
   ADM
============================ */

function mostrarSecao(id){

  ["comidaSecao","bebidaSecao","senhaSecao"]
  .forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");

  atualizarListasAdm();
}


/* ============================
   COMIDAS
============================ */

function salvarComida(){

  let nome=document.getElementById("nomeComida").value.trim();
  let preco=Number(document.getElementById("precoComida").value);

  if(!nome || preco<=0){
    alert("Digite o nome e o preço da comida.");
    return;
  }

  comidas.push({
    id:Date.now(),
    nome:nome,
    preco:preco
  });

  document.getElementById("nomeComida").value="";
  document.getElementById("precoComida").value="";

  salvarDados();
  renderizar();
  atualizarListasAdm();

  alert("Comida cadastrada!");
}

function editarComida(index){

  let novoNome=prompt(
    "Nome da comida:",
    comidas[index].nome
  );

  if(novoNome===null)return;

  let novoPreco=prompt(
    "Preço:",
    comidas[index].preco
  );

  if(novoPreco===null)return;

  if(!novoNome.trim() || Number(novoPreco)<=0){
    alert("Dados inválidos.");
    return;
  }

  comidas[index].nome=novoNome.trim();
  comidas[index].preco=Number(novoPreco);

  salvarDados();
  renderizar();
  atualizarListasAdm();
}

function excluirComida(index){

  if(!confirm("Excluir esta comida?"))return;

  comidas.splice(index,1);

  salvarDados();
  renderizar();
  atualizarListasAdm();
}


/* ============================
   BEBIDAS
============================ */

function salvarBebida(){

  let nome=document.getElementById("nomeBebida").value.trim();
  let preco=Number(document.getElementById("precoBebida").value);

  if(!nome){
    alert("Digite o nome da bebida.");
    return;
  }

  if(preco<0 || isNaN(preco)){
    alert("Digite um preço válido.");
    return;
  }

  bebidas.push({
    id:Date.now(),
    nome:nome,
    preco:preco
  });

  document.getElementById("nomeBebida").value="";
  document.getElementById("precoBebida").value="";

  salvarDados();
  renderizar();
  atualizarListasAdm();

  alert("Bebida cadastrada com sucesso!");
}

function editarBebida(index){

  let novoNome=prompt(
    "Nome da bebida:",
    bebidas[index].nome
  );

  if(novoNome===null)return;

  let novoPreco=prompt(
    "Preço da bebida:",
    bebidas[index].preco
  );

  if(novoPreco===null)return;

  if(!novoNome.trim() || Number(novoPreco)<0){
    alert("Dados inválidos.");
    return;
  }

  bebidas[index].nome=novoNome.trim();
  bebidas[index].preco=Number(novoPreco);

  salvarDados();
  renderizar();
  atualizarListasAdm();
}

function excluirBebida(index){

  if(!confirm("Excluir esta bebida?"))return;

  bebidas.splice(index,1);

  salvarDados();
  renderizar();
  atualizarListasAdm();
}


/* ============================
   LISTAS DO ADM
============================ */

function atualizarListasAdm(){

  const lc=document.getElementById("listaComidasAdm");
  const lb=document.getElementById("listaBebidasAdm");

  lc.innerHTML="";

  comidas.forEach((item,index)=>{
    lc.innerHTML+=`
      <div class="admin-item">
        <span>
          <b>${esc(item.nome)}</b><br>
          R$ ${dinheiro(item.preco)}
        </span>

        <button class="small edit"
          onclick="editarComida(${index})">
          ✏️
        </button>

        <button class="small delete"
          onclick="excluirComida(${index})">
          🗑️
        </button>
      </div>
    `;
  });

  lb.innerHTML="";

  bebidas.forEach((item,index)=>{
    lb.innerHTML+=`
      <div class="admin-item">
        <span>
          <b>🥤 ${esc(item.nome)}</b><br>
          R$ ${dinheiro(item.preco)}
        </span>

        <button class="small edit"
          onclick="editarBebida(${index})">
          ✏️
        </button>

        <button class="small delete"
          onclick="excluirBebida(${index})">
          🗑️
        </button>
      </div>
    `;
  });
}


/* ============================
   SENHA
============================ */

function alterarSenha(){

  let nova=document.getElementById("senhaNova").value.trim();

  if(!nova){
    alert("Digite uma nova senha.");
    return;
  }

  senhaAdm=nova;

  localStorage.setItem("senhaSaborMel",senhaAdm);

  document.getElementById("senhaNova").value="";

  alert("Senha alterada com sucesso!");
}


/* ============================
   WHATSAPP
============================ */

function enviarWhatsApp(){

  if(carrinho.length===0){
    alert("Adicione algum produto ao pedido.");
    return;
  }

  let nome=document.getElementById("clienteNome").value.trim();
  let endereco=document.getElementById("clienteEndereco").value.trim();
  let observacao=document.getElementById("observacao").value.trim();
  let pagamento=document.getElementById("pagamento").value;

  if(!nome || !endereco){
    alert("Preencha seu nome e endereço.");
    return;
  }

  let total=0;

  let texto="🍛 *NOVO PEDIDO - SABOR DE MEL*%0A%0A";

  texto+="👤 *Nome:* "+encodeURIComponent(nome)+"%0A";
  texto+="📍 *Endereço:* "+encodeURIComponent(endereco)+"%0A";
  texto+="💳 *Pagamento:* "+encodeURIComponent(pagamento)+"%0A%0A";

  texto+="🛒 *ITENS:*%0A";

  carrinho.forEach(item=>{

    let subtotal=item.preco*item.quantidade;
    total+=subtotal;

    texto+=encodeURIComponent(
      item.quantidade+"x "+item.nome+
      " - R$ "+dinheiro(subtotal)
    )+"%0A";
  });

  texto+="%0A💰 *TOTAL: R$ "+dinheiro(total)+"*%0A";

  if(observacao){
    texto+="%0A📝 *Observação:* "+
      encodeURIComponent(observacao);
  }

  /*
    WhatsApp da loja:
    55 + DDD + número
  */
  const whatsapp="5521974967664";

  const url=
    "https://wa.me/"+whatsapp+
    "?text="+texto;

  window.open(url,"_blank");
}


/* ============================
   UTILIDADES
============================ */

function fechar(id){
  document.getElementById(id).style.display="none";
}

function esc(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

window.onclick=function(e){

  if(e.target.classList.contains("modal")){
    e.target.style.display="none";
  }
};


/* INICIA */
renderizar();
</script>

</body>
  </html>
