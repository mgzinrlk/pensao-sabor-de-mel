<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nosso Cardápio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8e8;
  color:#222;
}
header{
  background:#e60000;
  color:white;
  text-align:center;
  padding:28px 15px 32px;
  box-shadow:0 3px 8px #999;
}
header h1{margin:0;font-size:42px}
header p{margin:10px 0 0;font-size:24px}

.container{
  max-width:850px;
  margin:auto;
  padding:35px 20px 80px;
}
h2{
  color:#d90000;
  font-size:38px;
  margin:0 0 25px;
}

.section{
  margin-bottom:35px;
}
.section-title{
  color:#d90000;
  font-size:30px;
  font-weight:bold;
  margin-bottom:15px;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 2px 8px #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.card-info{flex:1}
.card-name{
  font-size:22px;
  font-weight:bold;
}
.card-desc{
  color:#777;
  margin-top:5px;
}
.price{
  color:#d90000;
  font-size:22px;
  font-weight:bold;
  white-space:nowrap;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 20px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
.btn-red{
  background:#e60000;
  color:white;
}
.btn-yellow{
  background:#ffc400;
  color:#222;
}
.btn-gray{
  background:#ddd;
}
.full{
  width:100%;
  margin:15px 0;
  font-size:24px;
}

.hidden{display:none!important}

.admin-link{
  text-align:center;
  margin-top:30px;
  color:#777;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  z-index:999;
}
.modal-box{
  background:#fff;
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:25px;
}
.modal-box h2{
  font-size:30px;
}
input,select,textarea{
  width:100%;
  padding:14px;
  margin:7px 0 12px;
  border:1px solid #bbb;
  border-radius:10px;
  font-size:17px;
}
label{
  font-weight:bold;
}
.row{
  display:flex;
  gap:10px;
}
.row>*{flex:1}

.admin-item{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}
.admin-item strong{font-size:18px}

.qty{
  display:flex;
  align-items:center;
  gap:10px;
}
.qty button{
  padding:7px 12px;
  font-size:20px;
}

.total{
  background:#ffe16b;
  padding:18px;
  border-radius:12px;
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

#pedidoResumo{
  background:#f7f7f7;
  border-radius:12px;
  padding:15px;
  margin:15px 0;
}

.close{
  float:right;
  background:#eee;
  padding:7px 12px;
  border-radius:8px;
}

@media(max-width:600px){
  header h1{font-size:32px}
  header p{font-size:19px}
  h2{font-size:32px}
  .card{align-items:flex-start}
  .price{font-size:19px}
}
</style>
</head>

<body>

<header>
  <h1>🍴 Nosso Cardápio</h1>
  <p>Escolha suas opções e faça seu pedido</p>
</header>

<div class="container">

  <h2>📋 Cardápio</h2>

  <!-- COMIDAS -->
  <div class="section">
    <div class="section-title">🍛 Comidas</div>
    <div id="comidasPublicas"></div>
  </div>

  <!-- BEBIDAS -->
  <div class="section">
    <div class="section-title">🥤 Bebidas</div>
    <div id="bebidasPublicas"></div>
  </div>

  <!-- IMPORTANTE:
       QUENTINHAS NÃO APARECEM AQUI.
       ELAS SÓ APARECEM DENTRO DO PEDIDO. -->

  <button class="btn-red full" onclick="abrirPedido()">
    ➕ ADICIONAR PEDIDO
  </button>

  <div class="admin-link" onclick="abrirLoginAdmin()">
    🔐 Área Administrativa
  </div>

</div>


<!-- ================= PEDIDO ================= -->

<div id="modalPedido" class="modal hidden">
<div class="modal-box">

<button class="close" onclick="fecharTudo()">✕</button>

<h2>🛒 Seu Pedido</h2>

<label>Tamanho da quentinha</label>
<select id="tamanho">
  <option value="Grande" data-preco="21">Grande — R$ 21,00</option>
  <option value="Pequena" data-preco="18">Pequena — R$ 18,00</option>
  <option value="Promoção" data-preco="10">Promoção — R$ 10,00</option>
</select>

<label>Quantidade</label>
<input id="quantidadeQuentinha" type="number" min="1" value="1">

<div class="section-title">🍛 Comida</div>
<div id="comidasPedido"></div>

<div class="section-title">🥤 Bebidas</div>
<div id="bebidasPedido"></div>

<div class="total">
  Total: R$ <span id="totalPedido">0,00</span>
</div>

<button class="btn-red full" onclick="continuarCheckout()">
  CONTINUAR PEDIDO
</button>

</div>
</div>


<!-- ================= CHECKOUT ================= -->

<div id="modalCheckout" class="modal hidden">
<div class="modal-box">

<button class="close" onclick="fecharTudo()">✕</button>

<h2>📦 Seus Dados</h2>

<label>Nome</label>
<input id="clienteNome" placeholder="Digite seu nome">

<label>Endereço</label>
<textarea id="clienteEndereco" placeholder="Digite seu endereço"></textarea>

<label>Forma de pagamento</label>
<select id="pagamento">
  <option value="Pix">Pix</option>
  <option value="Dinheiro">Dinheiro</option>
  <option value="Cartão">Cartão</option>
</select>

<div id="pedidoResumo"></div>

<button class="btn-red full" onclick="enviarWhatsApp()">
  📲 ENVIAR PEDIDO PELO WHATSAPP
</button>

</div>
</div>


<!-- ================= LOGIN ADMIN ================= -->

<div id="modalLogin" class="modal hidden">
<div class="modal-box">

<button class="close" onclick="fecharTudo()">✕</button>

<h2>🔐 Área Administrativa</h2>

<label>Senha</label>
<input id="senhaAdmin" type="password" placeholder="Digite a senha">

<button class="btn-red full" onclick="entrarAdmin()">
  ENTRAR
</button>

</div>
</div>


<!-- ================= ADMIN ================= -->

<div id="modalAdmin" class="modal hidden">
<div class="modal-box">

<button class="close" onclick="fecharTudo()">✕</button>

<h2>⚙️ Painel Administrativo</h2>

<button class="btn-red full" onclick="mostrarAdmin('comidas')">
🍛 EDITAR COMIDAS
</button>

<button class="btn-red full" onclick="mostrarAdmin('bebidas')">
🥤 EDITAR BEBIDAS
</button>

<button class="btn-yellow full" onclick="mostrarAdmin('senha')">
🔑 ALTERAR SENHA
</button>

<div id="adminConteudo"></div>

</div>
</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const SUPABASE_URL =
"https://dnrxkaikqmobsroqngix.supabase.co/rest/v1/";

/*
  Número da loja:
  21 97496-7664
*/
const WHATSAPP = "5521974967664";


/* =====================================================
   DADOS INICIAIS
===================================================== */

const comidasPadrao = [
  {
    id:1,
    nome:"Prato do Dia",
    descricao:"Comida caseira",
    preco:0,
    ativo:false
  }
];

const bebidasPadrao = [
  {id:101,nome:"Coca-Cola 2LT",preco:15,ativo:true},
  {id:102,nome:"Fanta Laranja 2LT",preco:12,ativo:true},
  {id:103,nome:"Tobi 2LT",preco:7,ativo:true},
  {id:104,nome:"Coca-Cola Lata",preco:6,ativo:true},
  {id:105,nome:"Guaraná Antarctica Lata",preco:6,ativo:true},
  {id:106,nome:"Fanta Laranja Lata",preco:6,ativo:true},
  {id:107,nome:"Coca-Cola 600 ML",preco:8,ativo:true},
  {id:108,nome:"Activ Plus Uva",preco:0,ativo:false}
];


/* =====================================================
   CARREGAR DADOS
===================================================== */

function carregarDados(){

  if(!localStorage.getItem("comidas")){
    localStorage.setItem(
      "comidas",
      JSON.stringify(comidasPadrao)
    );
  }

  if(!localStorage.getItem("bebidas")){
    localStorage.setItem(
      "bebidas",
      JSON.stringify(bebidasPadrao)
    );
  }

  if(!localStorage.getItem("senhaAdmin")){
    localStorage.setItem("senhaAdmin","1234");
  }

  renderizarTudo();
}


function getComidas(){
  return JSON.parse(
    localStorage.getItem("comidas") || "[]"
  );
}

function getBebidas(){
  return JSON.parse(
    localStorage.getItem("bebidas") || "[]"
  );
}


/* =====================================================
   TELA INICIAL
===================================================== */

function renderizarTudo(){

  const comidas = getComidas()
    .filter(x => x.ativo);

  const bebidas = getBebidas()
    .filter(x => x.ativo);

  document.getElementById("comidasPublicas").innerHTML =
    comidas.length
    ? comidas.map(c => `
      <div class="card">
        <div class="card-info">
          <div class="card-name">${esc(c.nome)}</div>
          <div class="card-desc">${esc(c.descricao || "")}</div>
        </div>
      </div>
    `).join("")
    : `<p>Nenhuma comida disponível no momento.</p>`;


  document.getElementById("bebidasPublicas").innerHTML =
    bebidas.length
    ? bebidas.map(b => `
      <div class="card">
        <div class="card-info">
          <div class="card-name">${esc(b.nome)}</div>
        </div>
        <div class="price">
          ${b.preco > 0 ? "R$ " + moeda(b.preco) : ""}
        </div>
      </div>
    `).join("")
    : `<p>Nenhuma bebida disponível no momento.</p>`;
}


/* =====================================================
   ABRIR PEDIDO
===================================================== */

function abrirPedido(){

  renderizarOpcoesPedido();

  document.getElementById("modalPedido")
    .classList.remove("hidden");

  atualizarTotal();
}


function renderizarOpcoesPedido(){

  const comidas = getComidas()
    .filter(x => x.ativo);

  const bebidas = getBebidas()
    .filter(x => x.ativo);


  document.getElementById("comidasPedido").innerHTML =
    comidas.length
    ? comidas.map(c => `
      <div class="card">
        <div class="card-info">
          <div class="card-name">${esc(c.nome)}</div>
          <div class="card-desc">${esc(c.descricao || "")}</div>
        </div>

        <input
          type="number"
          min="0"
          value="0"
          class="itemQuantidade comidaQtd"
          data-id="${c.id}"
          data-nome="${esc(c.nome)}"
          data-preco="0"
          style="width:85px"
        >
      </div>
    `).join("")
    : `<p>Nenhuma comida cadastrada.</p>`;


  document.getElementById("bebidasPedido").innerHTML =
    bebidas.length
    ? bebidas.map(b => `
      <div class="card">
        <div class="card-info">
          <div class="card-name">${esc(b.nome)}</div>
          <div class="price">R$ ${moeda(b.preco)}</div>
        </div>

        <input
          type="number"
          min="0"
          value="0"
          class="itemQuantidade bebidaQtd"
          data-id="${b.id}"
          data-nome="${esc(b.nome)}"
          data-preco="${b.preco}"
          style="width:85px"
        >
      </div>
    `).join("")
    : `<p>Nenhuma bebida cadastrada.</p>`;


  document.querySelectorAll(".itemQuantidade")
    .forEach(i => {
      i.addEventListener("input", atualizarTotal);
    });

  document.getElementById("tamanho")
    .addEventListener("change", atualizarTotal);

  document.getElementById("quantidadeQuentinha")
    .addEventListener("input", atualizarTotal);
}


/* =====================================================
   TOTAL
===================================================== */

function atualizarTotal(){

  const select = document.getElementById("tamanho");
  const precoQuentinha =
    Number(select.options[select.selectedIndex].dataset.preco);

  const qtd =
    Math.max(
      1,
      Number(document.getElementById("quantidadeQuentinha").value || 1)
    );

  let total = precoQuentinha * qtd;


  document.querySelectorAll(".bebidaQtd")
    .forEach(input => {

      const quantidade = Number(input.value || 0);
      const preco = Number(input.dataset.preco || 0);

      total += quantidade * preco;
    });


  document.getElementById("totalPedido").textContent =
    moeda(total);
}


/* =====================================================
   CHECKOUT
===================================================== */

function continuarCheckout(){

  const tamanho =
    document.getElementById("tamanho").value;

  const qtd =
    Number(document.getElementById("quantidadeQuentinha").value || 1);

  const comidas = [];
  const bebidas = [];

  document.querySelectorAll(".comidaQtd")
    .forEach(input => {

      const q = Number(input.value || 0);

      if(q > 0){
        comidas.push({
          nome:input.dataset.nome,
          quantidade:q
        });
      }
    });


  document.querySelectorAll(".bebidaQtd")
    .forEach(input => {

      const q = Number(input.value || 0);

      if(q > 0){
        bebidas.push({
          nome:input.dataset.nome,
          quantidade:q,
          preco:Number(input.dataset.preco)
        });
      }
    });


  const preco =
    Number(
      document.getElementById("tamanho")
      .options[
        document.getElementById("tamanho").selectedIndex
      ].dataset.preco
    );

  let total = preco * qtd;

  bebidas.forEach(b => {
    total += b.preco * b.quantidade;
  });


  let html = `
    <strong>${qtd}x Quentinha ${esc(tamanho)}</strong>
    — R$ ${moeda(preco * qtd)}
  `;


  if(comidas.length){

    html += `<br><br><strong>Comidas:</strong><br>`;

    comidas.forEach(c => {
      html += `${c.quantidade}x ${esc(c.nome)}<br>`;
    });
  }


  if(bebidas.length){

    html += `<br><strong>Bebidas:</strong><br>`;

    bebidas.forEach(b => {
      html += `${b.quantidade}x ${esc(b.nome)} — R$ ${moeda(b.preco*b.quantidade)}<br>`;
    });
  }


  html += `
    <br>
    <strong>Total: R$ ${moeda(total)}</strong>
  `;

  document.getElementById("pedidoResumo").innerHTML = html;

  document.getElementById("modalPedido")
    .classList.add("hidden");

  document.getElementById("modalCheckout")
    .classList.remove("hidden");
}


/* =====================================================
   WHATSAPP
===================================================== */

function enviarWhatsApp(){

  const nome =
    document.getElementById("clienteNome").value.trim();

  const endereco =
    document.getElementById("clienteEndereco").value.trim();

  const pagamento =
    document.getElementById("pagamento").value;

  if(!nome){
    alert("Digite seu nome.");
    return;
  }

  if(!endereco){
    alert("Digite seu endereço.");
    return;
  }


  const tamanho =
    document.getElementById("tamanho").value;

  const qtd =
    Number(document.getElementById("quantidadeQuentinha").value || 1);

  const preco =
    Number(
      document.getElementById("tamanho")
      .options[
        document.getElementById("tamanho").selectedIndex
      ].dataset.preco
    );


  let total = preco * qtd;

  let mensagem =
`🍽️ *NOVO PEDIDO*

👤 Nome: ${nome}
📍 Endereço: ${endereco}

🍛 *QUENTINHAS*
${qtd}x ${tamanho} — R$ ${moeda(preco*qtd)}
`;


  const comidas = [];

  document.querySelectorAll(".comidaQtd")
    .forEach(input => {

      const q = Number(input.value || 0);

      if(q > 0){
        comidas.push(`${q}x ${input.dataset.nome}`);
      }
    });


  if(comidas.length){
    mensagem +=
`\n🍛 *COMIDAS*
${comidas.join("\n")}
`;
  }


  const bebidas = [];

  document.querySelectorAll(".bebidaQtd")
    .forEach(input => {

      const q = Number(input.value || 0);

      if(q > 0){

        const subtotal =
          q * Number(input.dataset.preco);

        total += subtotal;

        bebidas.push(
          `${q}x ${input.dataset.nome} — R$ ${moeda(subtotal)}`
        );
      }
    });


  if(bebidas.length){
    mensagem +=
`\n🥤 *BEBIDAS*
${bebidas.join("\n")}
`;
  }


  mensagem +=
`
💰 *TOTAL: R$ ${moeda(total)}*
💳 Pagamento: ${pagamento}

✅ Pedido confirmado pelo cardápio online.
`;


  const url =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(mensagem);

  window.location.href = url;
}


/* =====================================================
   ADMIN LOGIN
===================================================== */

function abrirLoginAdmin(){

  document.getElementById("senhaAdmin").value = "";

  document.getElementById("modalLogin")
    .classList.remove("hidden");
}


function entrarAdmin(){

  const senha =
    document.getElementById("senhaAdmin").value;

  const senhaCorreta =
    localStorage.getItem("senhaAdmin") || "1234";

  if(senha === senhaCorreta){

    document.getElementById("modalLogin")
      .classList.add("hidden");

    document.getElementById("modalAdmin")
      .classList.remove("hidden");

    mostrarAdmin("comidas");

  }else{

    alert("Senha incorreta.");
  }
}


/* =====================================================
   ADMIN
===================================================== */

function mostrarAdmin(tipo){

  const area =
    document.getElementById("adminConteudo");


  if(tipo === "senha"){

    area.innerHTML = `
      <hr>

      <h2>🔑 Alterar Senha</h2>

      <label>Nova senha</label>
      <input id="novaSenha" type="password">

      <button class="btn-red full"
        onclick="alterarSenha()">
        SALVAR NOVA SENHA
      </button>
    `;

    return;
  }


  const lista =
    tipo === "comidas"
      ? getComidas()
      : getBebidas();


  area.innerHTML = `

    <hr>

    <h2>
      ${tipo === "comidas"
        ? "🍛 Comidas"
        : "🥤 Bebidas"}
    </h2>

    <button class="btn-yellow full"
      onclick="novoItem('${tipo}')">
      ➕ ADICIONAR
    </button>

    <div id="listaAdmin"></div>
  `;


  document.getElementById("listaAdmin").innerHTML =
    lista.map(item => `

      <div class="admin-item">

        <strong>${esc(item.nome)}</strong>

        ${
          tipo === "comidas"
          ? `<p>${esc(item.descricao || "")}</p>`
          : `<p>R$ ${moeda(item.preco)}</p>`
        }

        <p>
          Status:
          <strong>
            ${item.ativo ? "ATIVO" : "OCULTO"}
          </strong>
        </p>

        <button
          class="btn-yellow"
          onclick="editarItem('${tipo}',${item.id})">
          ✏️ EDITAR
        </button>

        <button
          class="btn-gray"
          onclick="alternarItem('${tipo}',${item.id})">
          ${item.ativo ? "👁️ OCULTAR" : "👁️ MOSTRAR"}
        </button>

        <button
          class="btn-red"
          onclick="excluirItem('${tipo}',${item.id})">
          🗑️ EXCLUIR
        </button>

      </div>

    `).join("");
}


/* =====================================================
   NOVO ITEM
===================================================== */

function novoItem(tipo){

  const nome =
    prompt(
      tipo === "comidas"
      ? "Nome da comida:"
      : "Nome da bebida:"
    );

  if(!nome || !nome.trim()) return;


  let descricao = "";

  if(tipo === "comidas"){

    descricao =
      prompt("Descrição da comida:") || "";
  }


  let preco = 0;

  if(tipo === "bebidas"){

    preco =
      Number(
        prompt("Preço da bebida:") || 0
      );
  }


  const lista =
    tipo === "comidas"
      ? getComidas()
      : getBebidas();


  lista.push({
    id:Date.now(),
    nome:nome.trim(),
    descricao:descricao,
    preco:preco,
    ativo:true
  });


  salvarLista(tipo,lista);

  mostrarAdmin(tipo);
  renderizarTudo();
}


/* =====================================================
   EDITAR
===================================================== */

function editarItem(tipo,id){

  const lista =
    tipo === "comidas"
      ? getComidas()
      : getBebidas();

  const item =
    lista.find(x => x.id == id);

  if(!item) return;


  const novoNome =
    prompt(
      "Nome:",
      item.nome
    );

  if(!novoNome || !novoNome.trim()) return;


  item.nome =
    novoNome.trim();


  if(tipo === "comidas"){

    item.descricao =
      prompt(
        "Descrição:",
        item.descricao || ""
      ) || "";

  }else{

    item.preco =
      Number(
        prompt(
          "Preço:",
          item.preco
        ) || 0
      );
  }


  salvarLista(tipo,lista);

  mostrarAdmin(tipo);
  renderizarTudo();
}


/* =====================================================
   MOSTRAR / OCULTAR
===================================================== */

function alternarItem(tipo,id){

  const lista =
