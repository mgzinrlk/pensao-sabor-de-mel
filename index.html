<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#fff8ed;
      color:#222
    }

    header{
      background:#c91515;
      color:white;
      padding:22px 16px;
      text-align:center
    }

    header h1{
      margin:0 0 6px;
      font-size:30px
    }

    header p{margin:0}

    .wrap{
      max-width:900px;
      margin:auto;
      padding:18px
    }

    .status{
      padding:12px;
      border-radius:10px;
      margin-bottom:15px;
      background:#fff0c7
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:14px
    }

    .card{
      background:white;
      border-radius:15px;
      padding:15px;
      box-shadow:0 3px 12px #0001
    }

    .card img{
      width:100%;
      height:160px;
      object-fit:cover;
      border-radius:12px;
      background:#eee
    }

    .price{
      font-size:21px;
      font-weight:bold;
      color:#c91515
    }

    button{
      border:0;
      border-radius:10px;
      padding:12px 15px;
      font-weight:bold;
      cursor:pointer
    }

    .yellow{
      background:#ffd21a;
      color:#111
    }

    .red{
      background:#c91515;
      color:white
    }

    .cart{
      position:fixed;
      right:15px;
      bottom:15px;
      background:#ffd21a;
      color:#111;
      border-radius:50px;
      padding:15px 20px;
      box-shadow:0 4px 18px #0003
    }

    .hidden{
      display:none!important
    }

    input,select,textarea{
      width:100%;
      padding:12px;
      margin:6px 0 12px;
      border:1px solid #ccc;
      border-radius:9px;
      font-size:16px
    }

    label{
      font-weight:bold
    }

    .box{
      background:white;
      border-radius:15px;
      padding:18px;
      margin-top:18px;
      box-shadow:0 3px 12px #0001
    }

    .row{
      display:flex;
      gap:8px;
      flex-wrap:wrap
    }

    .row>*{
      flex:1
    }

    .item-admin{
      border:1px solid #ddd;
      padding:12px;
      border-radius:10px;
      margin:8px 0
    }

    .muted{
      color:#666
    }

    .danger{
      background:#eee;
      color:#a00
    }

    #adminBtn{
      position:fixed;
      left:12px;
      bottom:15px;
      background:#222;
      color:white;
      border-radius:50px
    }
  </style>
</head>

<body>

<header>
  <h1>🍽️ Meu Cardápio</h1>
  <p>Faça seu pedido de forma rápida</p>
</header>

<main class="wrap">

  <div id="status" class="status">
    Carregando cardápio...
  </div>

  <section id="menu" class="grid"></section>

  <div id="empty" class="box hidden">
    Nenhuma refeição publicada no momento.
  </div>

</main>

<button
  id="cartBtn"
  class="cart"
  onclick="openCheckout()">
  🛒 Pedido (<span id="cartCount">0</span>)
</button>

<button
  id="adminBtn"
  onclick="openAdmin()">
  ⚙️ Admin
</button>


<!-- =========================
     CHECKOUT
========================= -->

<div id="checkout" class="box wrap hidden">

  <h2>Finalizar pedido</h2>

  <div id="cartList"></div>

  <hr>

  <label>Nome</label>

  <input
    id="customerName"
    placeholder="Seu nome">

  <label>Endereço</label>

  <textarea
    id="customerAddress"
    placeholder="Rua, número, bairro..."></textarea>

  <label>Forma de pagamento</label>

  <select id="payment">

    <option value="">
      Escolha...
    </option>

    <option>
      Pix
    </option>

    <option>
      Dinheiro
    </option>

    <option>
      Cartão
    </option>

  </select>

  <label
    id="changeLabel"
    class="hidden">
    Troco para quanto?
  </label>

  <input
    id="change"
    class="hidden"
    placeholder="Ex.: R$ 50,00">

  <div class="row">

    <button
      class="yellow"
      onclick="closeCheckout()">
      Voltar
    </button>

    <button
      class="red"
      onclick="sendWhatsApp()">
      Enviar pedido no WhatsApp
    </button>

  </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="admin" class="box wrap hidden">

  <h2>Área administrativa</h2>

  <p class="muted">
    Cadastre, edite, publique ou remova as refeições.
  </p>


  <div id="loginBox">

    <label>
      Senha administrativa
    </label>

    <input
      id="adminPassword"
      type="password"
      placeholder="Senha">

    <button
      class="red"
      onclick="loginAdmin()">
      Entrar
    </button>

  </div>


  <div id="panel" class="hidden">

    <button
      class="yellow"
      onclick="logoutAdmin()">
      Sair
    </button>

    <button
      class="yellow"
      onclick="changePassword()">
      Mudar senha
    </button>


    <h3>Nova refeição</h3>

    <input
      id="foodName"
      placeholder="Nome da refeição">

    <input
      id="foodPrice"
      type="number"
      step="0.01"
      placeholder="Preço">

    <input
      id="foodDesc"
      placeholder="Descrição">

    <input
      id="foodImage"
      placeholder="URL da imagem (opcional)">

    <label>
      <input
        id="foodPublished"
        type="checkbox"
        checked>

      Publicar para clientes
    </label>

    <br><br>

    <button
      class="red"
      onclick="addFood()">
      Adicionar refeição
    </button>


    <h3>
      Refeições cadastradas
    </h3>

    <div id="adminList"></div>

  </div>

</div>


<script>

  /* ==========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "https://dnrxkaikqmobsroqngix.supabase.co";


  /*
     COLE AQUI A CHAVE PUBLICÁVEL DO SUPABASE.

     NÃO COLOQUE A SERVICE_ROLE / SECRET KEY.
  */

  const SUPABASE_KEY =
    "COLE_SUA_CHAVE_PUBLICAVEL_AQUI";


  /*
     COLOQUE AQUI O WHATSAPP QUE VAI RECEBER
     OS PEDIDOS.

     EXEMPLO:
     5511999999999
  */

  const WHATSAPP =
    "5599999999999";


  const TABLE =
    "Refeições";


  let supabase = null;

  let foods = [];

  let cart = [];


  const $ = id =>
    document.getElementById(id);


  /* ==========================================
     INICIAR SUPABASE
  ========================================== */

  if(
    SUPABASE_KEY &&
    !SUPABASE_KEY.includes(
      "COLE_SUA_CHAVE"
    )
  ){

    supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

  }


  /* ==========================================
     DINHEIRO
  ========================================== */

  function money(value){

    return Number(
      value || 0
    ).toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    );

  }


  /* ==========================================
     STATUS
  ========================================== */

  function showStatus(
    text,
    error=false
  ){

    $("status").textContent =
      text;

    $("status").style.background =
      error
      ? "#ffd7d7"
      : "#fff0c7";

  }


  /* ==========================================
     CARREGAR CARDÁPIO
  ========================================== */

  async function loadFoods(){

    if(!supabase){

      showStatus(
        "Falta colocar a chave pública do Supabase no código.",
        true
      );

      return;
    }


    showStatus(
      "Carregando cardápio..."
    );


    const {
      data,
      error
    } =
      await supabase
      .from(TABLE)
      .select("*")
      .eq("publicado",true)
      .order(
        "id",
        {
          ascending:false
        }
      );


    if(error){

      console.error(error);

      showStatus(
        "Erro ao carregar: " +
        error.message,
        true
      );

      return;
    }


    foods =
      data || [];


    renderMenu();


    showStatus(
      "Cardápio carregado."
    );

  }


  /* ==========================================
     MOSTRAR CARDÁPIO
  ========================================== */

  function renderMenu(){

    const menu =
      $("menu");


    menu.innerHTML = "";


    if(!foods.length){

      $("empty")
        .classList
        .remove("hidden");

      return;
    }


    $("empty")
      .classList
      .add("hidden");


    foods.forEach(food => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card";


      card.innerHTML = `

        ${
          food.imagem
          ?
          `<img
            src="${escapeHtml(food.imagem)}"
            alt="">`
          :
          ""
        }

        <h3>
          ${escapeHtml(
            food.nome ||
            "Refeição"
          )}
        </h3>

        <p class="muted">
          ${escapeHtml(
            food.descricao ||
            ""
          )}
        </p>

        <p class="price">
          ${money(food.preco)}
        </p>

        <button
          class="yellow"
          onclick="addToCart(${Number(food.id)})">

          Adicionar

        </button>

      `;


      menu.appendChild(card);

    });

  }


  /* ==========================================
     SEGURANÇA HTML
  ========================================== */

  function escapeHtml(value){

    return String(
      value ?? ""
    )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

  }


  /* ==========================================
     CARRINHO
  ========================================== */

  function addToCart(id){

    const food =
      foods.find(
        x =>
        Number(x.id) ===
        Number(id)
      );


    if(!food)
      return;


    const existing =
      cart.find(
        x =>
        Number(x.id) ===
        Number(id)
      );


    if(existing){

      existing.qty++;

    }else{

      cart.push({
        ...food,
        qty:1
      });

    }


    updateCart();

  }


  function updateCart(){

    $("cartCount")
      .textContent =
      cart.reduce(
        (total,item) =>
        total + item.qty,
        0
      );

  }


  /* ==========================================
     ABRIR CHECKOUT
  ========================================== */

  function openCheckout(){

    $("checkout")
      .classList
      .remove("hidden");


    $("admin")
      .classList
      .add("hidden");


    renderCart();


    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  }


  function closeCheckout(){

    $("checkout")
      .classList
      .add("hidden");


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }


  /* ==========================================
     MOSTRAR CARRINHO
  ========================================== */

  function renderCart(){

    const box =
      $("cartList");


    if(!cart.length){

      box.innerHTML =
        "<p>Nenhum item no pedido.</p>";

      return;
    }


    box.innerHTML =
      cart.map(
        (item,index) => `

          <div class="item-admin">

            <b>
              ${escapeHtml(item.nome)}
            </b>

            <br>

            ${item.qty}
            ×
            ${money(item.preco)}


            <div class="row">

              <button
                onclick="
                  cart[${index}].qty--;

                  if(
                    cart[${index}].qty <= 0
                  ){
                    cart.splice(${index},1);
                  }

                  updateCart();
                  renderCart();
                ">

                −

              </button>


              <button
                onclick="
                  cart[${index}].qty++;
                  updateCart();
                  renderCart();
                ">

                +

              </button>


              <button
                class="danger"
                onclick="
                  cart.splice(${index},1);
                  updateCart();
                  renderCart();
                ">

                Remover

              </button>

            </div>

          </div>

        `
      ).join("");


    const total =
      cart.reduce(
        (sum,item) =>
        sum +
        Number(item.preco) *
        item.qty,
        0
      );


    box.innerHTML += `

      <h3>
        Total: ${money(total)}
      </h3>

    `;

  }


  /* ==========================================
     PAGAMENTO
  ========================================== */

  $("payment")
    .addEventListener(
      "change",
      function(){

        const isMoney =
          this.value ===
          "Dinheiro";


        $("change")
          .classList
          .toggle(
            "hidden",
            !isMoney
          );


        $("changeLabel")
          .classList
          .toggle(
            "hidden",
            !isMoney
          );

      }
    );


  /* ==========================================
     WHATSAPP
  ========================================== */

  function sendWhatsApp(){

    if(!cart.length){

      alert(
        "Adicione pelo menos uma refeição."
      );

      return;
    }


    const name =
      $("customerName")
      .value
      .trim();


    const address =
      $("customerAddress")
      .value
      .trim();


    const payment =
      $("payment")
      .value;


    if(
      !name ||
      !address ||
      !payment
    ){

      alert(
        "Preencha nome, endereço e forma de pagamento."
      );

      return;
    }


    const total =
      cart.reduce(
        (sum,item) =>
        sum +
        Number(item.preco) *
        item.qty,
        0
      );


    let message =
      "🍽️ *NOVO PEDIDO*%0A%0A";


    message +=
      "👤 *Nome:* " +
      encodeURIComponent(name) +
      "%0A";


    message +=
      "📍 *Endereço:* " +
      encodeURIComponent(address) +
      "%0A";


    message +=
      "💳 *Pagamento:* " +
      encodeURIComponent(payment) +
      "%0A";


    if(
      payment === "Dinheiro" &&
      $("change").value.trim()
    ){

      message +=
        "💵 *Troco para:* " +
        encodeURIComponent(
          $("change").value.trim()
        ) +
        "%0A";

    }


    message +=
      "%0A*ITENS:*%0A";


    cart.forEach(item => {

      message +=
        "• " +
        item.qty +
        "x " +
        encodeURIComponent(
          item.nome
        ) +
        " — " +
        encodeURIComponent(
          money(
            Number(item.preco) *
            item.qty
          )
        ) +
        "%0A";

    });


    message +=
      "%0A💰 *TOTAL: " +
      encodeURIComponent(
        money(total)
      ) +
      "*";


    window.open(
      "https://wa.me/" +
      WHATSAPP +
      "?text=" +
      message,
      "_blank"
    );

  }


  /* ==========================================
     ADMIN
  ========================================== */

  function openAdmin(){

    $("admin")
      .classList
      .remove("hidden");


    $("checkout")
      .classList
      .add("hidden");


    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  }


  /* ==========================================
     SENHA
  ========================================== */

  function getPassword(){

    return (
      localStorage.getItem(
        "cardapio_admin_password"
      )
      ||
      "123456"
    );

  }


  function loginAdmin(){

    const password =
      $("adminPassword")
      .value;


    if(
      password ===
      getPassword()
    ){

      $("loginBox")
        .classList
        .add("hidden");


      $("panel")
        .classList
        .remove("hidden");


      renderAdmin();

    }else{

      alert(
        "Senha incorreta."
      );

    }

  }


  function logoutAdmin(){

    $("panel")
      .classList
      .add("hidden");


    $("loginBox")
      .classList
      .remove("hidden");


    $("adminPassword")
      .value = "";

  }


  function changePassword(){

    const oldPassword =
      prompt(
        "Digite a senha atual:"
      );


    if(
      oldPassword !==
      getPassword()
    ){

      alert(
        "Senha atual incorreta."
      );

      return;
    }


    const newPassword =
      prompt(
        "Digite a nova senha:"
      );


    if(
      !newPassword ||
      newPassword.length < 4
    ){

      alert(
        "A nova senha precisa ter pelo menos 4 caracteres."
      );

      return;
    }


    localStorage.setItem(
      "cardapio_admin_password",
      newPassword
    );


    alert(
      "Senha alterada!"
    );

  }


  /* ==========================================
     ADICIONAR REFEIÇÃO
  ========================================== */

  async function addFood(){

    if(!supabase){

      alert(
        "Configure a chave do Supabase primeiro."
      );

      return;
    }


    const nome =
      $("foodName")
      .value
      .trim();


    const preco =
      Number(
        $("foodPrice")
        .value
      );


    const descricao =
      $("foodDesc")
      .value
      .trim();


    const imagem =
      $("foodImage")
      .value
      .trim();


    const publicado =
      $("foodPublished")
      .checked;


    if(
      !nome ||
      !preco
    ){

      alert(
        "Informe nome e preço."
      );

      return;
    }


    const payload = {

      nome:
        nome,

      preco:
        preco,

      descricao:
        descricao,

      imagem:
        imagem,

      publicado:
        publicado

    };


    const {
      error
    } =
      await supabase
      .from(TABLE)
      .insert(payload);


    if(error){

      console.error(error);

      alert(
        "Erro ao cadastrar: " +
        error.message
      );

      return;
    }


    $("foodName")
      .value = "";


    $("foodPrice")
      .value = "";


    $("foodDesc")
      .value = "";


    $("foodImage")
      .value = "";


    $("foodPublished")
      .checked = true;


    alert(
      "Refeição cadastrada!"
    );


    await loadFoods();

    await renderAdmin();

  }


  /* ==========================================
     LISTAR ADMIN
  ========================================== */

  async function renderAdmin(){

    if(!supabase)
      return;


    const {
      data,
      error
    } =
      await supabase
      .from(TABLE)
      .select("*")
      .order(
        "id",
        {
          ascending:false
        }
      );


    if(error){

      $("adminList")
        .innerHTML =
        "<p>Erro: " +
        escapeHtml(
          error.message
        ) +
        "</p>";

      return;
    }


    $("adminList")
      .innerHTML =
      (data || [])
      .map(
        food => `

          <div class="item-admin">

            <b>
              ${escapeHtml(
                food.nome
              )}
            </b>

            —
            ${money(food.preco)}

            <br><br>

            <span>

              ${
                food.publicado
                ?
                "🟢 Publicado"
                :
                "🔴 Oculto"
              }

            </span>

            <div class="row">

              <button
                class="yellow"
                onclick="
                  togglePublished(
                    ${Number(food.id)},
                    ${!food.publicado}
                  )
                ">

                ${
                  food.publicado
                  ?
                  "Ocultar"
                  :
                  "Publicar"
                }

              </button>


              <button
                class="danger"
                onclick="
                  deleteFood(
                    ${Number(food.id)}
                  )
