<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio da Loja</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#fff8e1;
  color:#222;
}

header{
  background:#d71920;
  color:white;
  text-align:center;
  padding:28px 15px;
  border-bottom:6px solid #ffc400;
}

header h1{
  font-size:30px;
  font-weight:900;
}

header p{
  margin-top:8px;
  color:#fff4c2;
}

.container{
  width:94%;
  max-width:650px;
  margin:20px auto;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:16px;
  border:2px solid #ffd43b;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card h2{
  color:#d71920;
  margin-bottom:8px;
}

.card p{
  color:#666;
  margin-bottom:12px;
}

.preco{
  color:#d71920;
  font-size:24px;
  font-weight:900;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px;
  font-weight:bold;
  cursor:pointer;
}

.add{
  width:100%;
  background:#ffc400;
  color:#111;
  font-size:16px;
  border:2px solid #e0a900;
}

.carrinho-btn{
  position:sticky;
  bottom:15px;
  width:100%;
  background:#d71920;
  color:white;
  font-size:18px;
  margin-top:5px;
  border:3px solid #ffc400;
  box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:13px 0;
  gap:10px;
}

.item-info{
  flex:1;
}

.item-info strong{
  color:#d71920;
}

.qtd{
  display:flex;
  align-items:center;
  gap:7px;
}

.qtd button{
  width:32px;
  height:32px;
  padding:0;
  background:#d71920;
  color:white;
}

.total{
  text-align:right;
  font-size:24px;
  font-weight:900;
  color:#d71920;
  margin:20px 0;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 6px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:2px solid #ddd;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:80px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:10;
  overflow:auto;
  padding:20px 0;
}

.modal-content{
  background:white;
  width:94%;
  max-width:600px;
  margin:auto;
  border-radius:16px;
  padding:20px;
  border-top:7px solid #d71920;
}

.fechar{
  float:right;
  background:#eee;
  color:#111;
  padding:8px 12px;
}

.confirmar{
  width:100%;
  background:#d71920;
  color:white;
  font-size:17px;
  margin-top:18px;
  border:3px solid #ffc400;
}

.cancelar{
  width:100%;
  background:#eee;
  margin-top:10px;
}

.pix{
  display:none;
  text-align:center;
  margin-top:15px;
  padding:15px;
  background:#fff8d6;
  border:2px solid #ffc400;
  border-radius:12px;
}

#qrcode{
  display:flex;
  justify-content:center;
  margin:15px 0;
}

.admin-link{
  text-align:center;
  margin:30px 0;
}

.admin-link button{
  background:transparent;
  color:#999;
}

.admin{
  display:none;
}

.admin-card{
  background:#fff8e1;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
  border:2px solid #ffd43b;
}

.admin-card button{
  margin-top:8px;
  background:#d71920;
  color:white;
}

.remover{
  background:#b00000 !important;
}

.salvar{
  width:100%;
  background:#d71920;
  color:white;
  margin-top:15px;
  border:3px solid #ffc400;
}

.aviso{
  background:#fff3cd;
  color:#856404;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  border-left:5px solid #ffc400;
}
</style>
</head>

<body>

<header>
  <h1>🍽️ CARDÁPIO DO DIA</h1>
  <p>Escolha sua quentinha</p>
</header>

<div class="container">

<div id="cardapio"></div>

<button class="carrinho-btn" onclick="abrirPedido()">
🛒 VER MEU PEDIDO
</button>

<div class="admin-link">
<button onclick="abrirLogin()">Área administrativa</button>
</div>

</div>


<!-- PEDIDO -->

<div class="modal" id="modalPedido">

<div class="modal-content">

<button class="fechar" onclick="fecharPedido()">✕</button>

<h2>🛒 Seu pedido</h2>

<br>

<div id="listaCarrinho"></div>

<div class="total">
Total: R$ <span id="total">0,00</span>
</div>

<label>📝 Observação</label>

<textarea
id="observacao"
placeholder="Ex: sem cebola, pouco sal..."
></textarea>

<label>👤 Nome</label>

<input
id="nome"
placeholder="Digite seu nome"
>

<label>📍 Endereço</label>

<textarea
id="endereco"
placeholder="Rua, número, complemento..."
></textarea>

<label>💳 Forma de pagamento</label>

<select id="pagamento" onchange="mostrarPagamento()">

<option value="">Selecione</option>
<option value="Pix">Pix</option>
<option value="Dinheiro">Dinheiro</option>
<option value="Cartão">Cartão</option>

</select>

<div id="trocoArea" style="display:none">

<label>💵 Troco para quanto?</label>

<input
type="number"
id="troco"
placeholder="Ex: 50"
>

</div>

<div class="pix" id="pixBox">

<strong>📱 PAGAMENTO PIX</strong>

<div id="qrcode"></div>

<div id="chavePix"></div>

</div>

<button class="confirmar" onclick="finalizarPedido()">
✅ CONFIRMAR PEDIDO
</button>

<button class="cancelar" onclick="fecharPedido()">
Voltar
</button>

</div>
</div>


<!-- LOGIN -->

<div class="modal" id="modalLogin">

<div class="modal-content">

<h2>🔐 Área Administrativa</h2>

<label>Senha</label>

<input
type="password"
id="senhaAdmin"
placeholder="Digite a senha"
>

<button class="confirmar" onclick="entrarAdmin()">
ENTRAR
</button>

<button class="cancelar" onclick="fecharLogin()">
Cancelar
</button>

</div>
</div>


<!-- ADMIN -->

<div class="modal" id="modalAdmin">

<div class="modal-content">

<button class="fechar" onclick="fecharAdmin()">✕</button>

<h2>⚙️ PAINEL ADMINISTRATIVO</h2>

<br>

<label>📱 WhatsApp da loja</label>

<input
id="adminWhatsApp"
placeholder="5521999999999"
>

<label>💳 Chave Pix</label>

<input
id="adminPix"
placeholder="Digite sua chave Pix"
>

<h3 style="margin-top:20px">
🍽️ CARDÁPIO
</h3>

<div id="adminCardapio"></div>

<button class="salvar" onclick="adicionarPrato()">
➕ ADICIONAR ITEM
</button>

<button class="salvar" onclick="salvarTudo()">
💾 SALVAR ALTERAÇÕES
</button>

<div class="aviso">
Senha inicial do administrador: <strong>1234</strong>
</div>

</div>
</div>


<script>

/* ===========================
CONFIGURAÇÃO
=========================== */

let config =
JSON.parse(localStorage.getItem("configLoja"))
|| {

  whatsapp:"5521999999999",

  pix:"",

  senha:"1234"

};


/* ===========================
CARDÁPIO INICIAL
=========================== */

let cardapio =
JSON.parse(localStorage.getItem("cardapio"))
|| [

{
 id:1,
 nome:"Quentinha R$10",
 descricao:"Quentinha econômica",
 preco:10,
 ativo:true
},

{
 id:2,
 nome:"Quentinha Pequena",
 descricao:"Quentinha pequena",
 preco:18,
 ativo:true
},

{
 id:3,
 nome:"Quentinha Grande",
 descricao:"Quentinha grande",
 preco:21,
 ativo:true
}

];


let carrinho=[];


/* ===========================
MOSTRAR CARDÁPIO
=========================== */

function mostrarCardapio(){

const div=document.getElementById("cardapio");

div.innerHTML="";

cardapio
.filter(p=>p.ativo)
.forEach(p=>{

div.innerHTML+=`

<div class="card">

<h2>🍽️ ${p.nome}</h2>

<p>${p.descricao}</p>

<div class="preco">
R$ ${p.preco.toFixed(2).replace(".",",")}
</div>

<button
class="add"
onclick="adicionar(${p.id})">

➕ ADICIONAR PEDIDO

</button>

</div>

`;

});

}


/* ===========================
ADICIONAR
=========================== */

function adicionar(id){

const prato=
cardapio.find(p=>p.id===id);

if(!prato)return;

const item=
carrinho.find(i=>i.id===id);

if(item){

item.qtd++;

}else{

carrinho.push({

id:prato.id,
nome:prato.nome,
preco:prato.preco,
qtd:1

});

}

}


/* ===========================
ABRIR PEDIDO
=========================== */

function abrirPedido(){

document.getElementById("modalPedido")
.style.display="block";

atualizarCarrinho();

}


function fecharPedido(){

document.getElementById("modalPedido")
.style.display="none";

}


/* ===========================
CARRINHO
=========================== */

function atualizarCarrinho(){

const div=
document.getElementById("listaCarrinho");

div.innerHTML="";

let total=0;

if(carrinho.length===0){

div.innerHTML="<p>Seu pedido está vazio.</p>";

document.getElementById("total")
.innerText="0,00";

return;

}

carrinho.forEach(item=>{

let subtotal=
item.preco*item.qtd;

total+=subtotal;

div.innerHTML+=`

<div class="item">

<div class="item-info">

<strong>${item.nome}</strong>

<br>

R$ ${item.preco.toFixed(2).replace(".",",")}

</div>

<div class="qtd">

<button onclick="diminuir(${item.id})">
-
</button>

<strong>${item.qtd}</strong>

<button onclick="aumentar(${item.id})">
+
</button>

</div>

</div>

`;

});

document.getElementById("total")
.innerText=
total.toFixed(2).replace(".",",");

}


function aumentar(id){

let item=
carrinho.find(i=>i.id===id);

if(item)item.qtd++;

atualizarCarrinho();

}


function diminuir(id){

let item=
carrinho.find(i=>i.id===id);

if(!item)return;

item.qtd--;

if(item.qtd<=0){

carrinho=
carrinho.filter(i=>i.id!==id);

}

atualizarCarrinho();

}


/* ===========================
PAGAMENTO
=========================== */

function mostrarPagamento(){

let pagamento=
document.getElementById("pagamento").value;

let pix=
document.getElementById("pixBox");

let troco=
document.getElementById("trocoArea");

pix.style.display="none";
troco.style.display="none";


if(pagamento==="Pix"){

pix.style.display="block";

document.getElementById("chavePix")
.innerText=
"Chave Pix: "+
(config.pix||"Não cadastrada");

document.getElementById("qrcode")
.innerHTML="";

if(config.pix){

new QRCode(
document.getElementById("qrcode"),
{
text:config.pix,
width:180,
height:180
}
);

}

}


if(pagamento==="Dinheiro"){

troco.style.display="block";

}

}


/* ===========================
FINALIZAR PEDIDO
=========================== */

function finalizarPedido(){

if(carrinho.length===0){

alert("Adicione algum item.");

return;

}


let nome=
document.getElementById("nome")
.value.trim();

let endereco=
document.getElementById("endereco")
.value.trim();

let observacao=
document.getElementById("observacao")
.value.trim();

let pagamento=
document.getElementById("pagamento")
.value;

let troco=
document.getElementById("troco")
.value;


if(!nome){

alert("Digite seu nome.");

return;

}


if(!endereco){

alert("Digite seu endereço.");

return;

}


if(!pagamento){

alert("Escolha o pagamento.");

return;

}


let numero=
Number(
localStorage.getItem("numeroPedido")
)||0;

numero++;

localStorage.setItem(
"numeroPedido",
numero
);


let numeroPedido=
String(numero).padStart(4,"0");


let total=0;

let itens="";


carrinho.forEach(item=>{

let subtotal=
item.preco*item.qtd;

total+=subtotal;

itens+=
"\n🥡 "+
item.nome+
" x"+
item.qtd+
" — R$ "+
subtotal.toFixed(2)
.replace(".",",");

});


let mensagem=

`✅ *PEDIDO #${numeroPedido}*

👤 *Nome:* ${nome}

📍 *Endereço:* ${endereco}

🛒 *ITENS:*${itens}

📝 *Observação:* ${
observacao||"Nenhuma"
}

💳 *Pagamento:* ${pagamento}`;


if(
pagamento==="Dinheiro" &&
troco
){

mensagem+=

`\n💵 *Troco para:* R$ ${
Number(troco)
.toFixed(2)
.replace(".",",")
}`;

}


mensagem+=

`\n\n💰 *TOTAL: R$ ${
total.toFixed(2)
.replace(".",",")
}*

\n\n📲 *Pedido realizado pelo site.*`;


let url=
"https://wa.me/"+
config.whatsapp+
"?text="+
encodeURIComponent(mensagem);


window.open(url,"_blank");


carrinho=[];

fecharPedido();

}


/* ===========================
LOGIN ADMIN
=========================== */

function abrirLogin(){

document.getElementById("modalLogin")
.style.display="block";

}


function fecharLogin(){

document.getElementById("modalLogin")
.style.display="none";

}


function entrarAdmin(){

let senha=
document.getElementById("senhaAdmin")
.value;

if(senha!==config.senha){

alert("Senha incorreta!");

return;

}

fecharLogin();

abrirAdmin();

}


function abrirAdmin(){

document.getElementById("modalAdmin")
.style.display="block";

document.getElementById("adminWhatsApp")
.value=config.whatsapp;

document.getElementById("adminPix")
.value=config.pix;

mostrarAdminCardapio();

}


function fecharAdmin(){

document.getElementById("modalAdmin")
.style.display="none";

}


/* ===========================
ADMIN CARDÁPIO
=========================== */

function mostrarAdminCardapio(){

let div=
document.getElementById("adminCardapio");

div.innerHTML="";


cardapio.forEach((p,index)=>{

div.innerHTML+=`

<div class="admin-card">

<label>Nome</label>

<input
value="${p.nome}"
onchange="
cardapio[${index}].nome=this.value
"
>

<label>Descrição</label>

<input
value="${p.descricao}"
onchange="
cardapio[${index}].descricao=this.value
"
>

<label>Preço</label>

<input
type="number"
step="0.01"
value="${p.preco}"
onchange="
cardapio[${index}].preco=Number(this.value)
"
>

<label>

<input
type="checkbox"
${p.ativo?"checked":""}
onchange="
cardapio[${index}].ativo=this.checked
"
>

 Mostrar no cardápio

</label>

<button
class="remover"
onclick="removerPrato(${index})">

🗑️ EXCLUIR

</button>

</div>

`;

});

}


/* ===========================
ADICIONAR ITEM
=========================== */

function adicionarPrato(){

cardapio.push({

id:Date.now(),

nome:"Novo prato",

descricao:"Descrição",

preco:0,

ativo:true

});

mostrarAdminCardapio();

}


/* ===========================
REMOVER
=========================== */

function removerPrato(index){

if(!confirm("Excluir este item?"))
return;

cardapio.splice(index,1);

mostrarAdminCardapio();

}


/* ===========================
SALVAR
=========================== */

function salvarTudo(){

config.whatsapp=
document.getElementById("adminWhatsApp")
.value.trim();

config.pix=
document.getElementById("adminPix")
.value.trim();


localStorage.setItem(
"configLoja",
JSON.stringify(config)
);

localStorage.setItem(
"cardapio",
JSON.stringify(cardapio)
);


mostrarCardapio();

alert("✅ Alterações salvas!");

}


/* ===========================
INICIAR
=========================== */

mostrarCardapio();

</script>

</body>
</html>
