<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cardápio da Loja</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8e8;
  color:#222;
}
header{
  background:#d90000;
  color:white;
  padding:18px 15px;
  text-align:center;
  box-shadow:0 2px 8px #999;
}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0}
.container{max-width:650px;margin:auto;padding:15px}
h2{color:#d90000}
.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 2px 8px #ddd;
}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.item-info{flex:1}
.item-info strong{font-size:18px}
.price{
  color:#d90000;
  font-weight:bold;
  margin-top:5px;
}
button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
}
.btn{
  background:#ffd400;
  color:#111;
}
.btn-red{
  background:#d90000;
  color:white;
}
.btn-green{
  background:#159447;
  color:white;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  margin:6px 0 12px;
  font-size:16px;
}
.hidden{display:none!important}
.center{text-align:center}
.total{
  font-size:22px;
  font-weight:bold;
  color:#d90000;
  text-align:center;
  margin:15px 0;
}
.qty{
  display:flex;
  align-items:center;
  gap:8px;
}
.qty button{
  padding:6px 11px;
  background:#eee;
}
.qty span{
  min-width:25px;
  text-align:center;
  font-weight:bold;
}
.admin-link{
  background:none;
  color:#777;
  font-size:12px;
  margin-top:20px;
}
.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:15px;
}
.tabs button{white-space:nowrap}
.danger{background:#b00000;color:white}
hr{border:0;border-top:1px solid #ddd;margin:18px 0}
.small{font-size:13px;color:#666}
</style>
</head>

<body>

<header>
  <h1 id="tituloLoja">🍽️ Nosso Cardápio</h1>
  <p>Escolha suas opções e faça seu pedido</p>
</header>

<!-- ================= TELA INICIAL ================= -->
<div id="inicio" class="container">

  <h2>📋 Cardápio</h2>

  <div id="cardapio"></div>

  <button class="btn-red" style="width:100%;font-size:18px"
          onclick="abrirPedido()">
    ➕ ADICIONAR PEDIDO
  </button>

  <div class="center">
    <button class="admin-link" onclick="abrirLogin()">
      🔐 Área Administrativa
    </button>
  </div>
</div>

<!-- ================= MONTAR PEDIDO ================= -->
<div id="pedido" class="container hidden">

  <button class="btn" onclick="voltarInicio()">← Voltar</button>

  <h2>🛒 Seu Pedido</h2>

  <div class="card">
    <h3>🍱 Escolha sua quentinha</h3>

    <select id="tamanho">
      <option value="">Selecione</option>
      <option value="Quentinha Grande">Grande - R$ 21,00</option>
      <option value="Quentinha Pequena">Pequena - R$ 18,00</option>
      <option value="Promoção">Promoção - R$ 10,00</option>
    </select>

    <input id="qtdQuentinha"
           type="number"
           min="1"
           value="1"
           placeholder="Quantidade">

    <h3>🍛 Comidas</h3>
    <div id="comidasPedido"></div>

    <h3>🥤 Bebidas</h3>
    <div id="bebidasPedido"></div>
  </div>

  <div class="card">
    <h3>👤 Seus dados</h3>

    <input id="nome" placeholder="Seu nome">

    <input id="endereco" placeholder="Endereço completo">

    <input id="referencia" placeholder="Ponto de referência (opcional)">

    <select id="pagamento">
      <option value="">Forma de pagamento</option>
      <option>Pix</option>
      <option>Dinheiro</option>
      <option>Cartão</option>
    </select>

    <input id="troco"
           placeholder="Troco para quanto? (se for dinheiro)">

    <textarea id="observacao"
              placeholder="Observação do pedido"></textarea>
  </div>

  <div class="card">
    <div class="total">
      Total: R$ <span id="total">0,00</span>
    </div>

    <button class="btn-green"
            style="width:100%;font-size:18px"
            onclick="finalizarPedido()">
      ✅ CONFIRMAR PEDIDO PELO WHATSAPP
    </button>
  </div>

</div>

<!-- ================= LOGIN ADM ================= -->
<div id="login" class="container hidden">

  <div class="card">
    <h2>🔐 Área Administrativa</h2>

    <input id="senhaLogin"
           type="password"
           placeholder="Senha">

    <button class="btn-red"
            style="width:100%"
            onclick="entrarAdmin()">
      ENTRAR
    </button>

    <button class="btn"
            style="width:100%;margin-top:8px"
            onclick="voltarInicio()">
      Voltar
    </button>
  </div>

</div>

<!-- ================= ADM ================= -->
<div id="admin" class="container hidden">

  <button class="btn" onclick="voltarInicio()">← Sair</button>

  <h2>⚙️ Painel Administrativo</h2>

  <div class="tabs">
    <button class="btn" onclick="mostrarAba('produtos')">🍛 Cardápio</button>
    <button class="btn" onclick="mostrarAba('bebidas')">🥤 Bebidas</button>
    <button class="btn" onclick="mostrarAba('senha')">🔑 Senha</button>
  </div>

  <!-- PRODUTOS -->
  <div id="abaProdutos">

    <div class="card">
      <h3>➕ Adicionar comida</h3>

      <input id="novoNome" placeholder="Nome da comida">

      <input id="novoPreco"
             type="number"
             step="0.01"
             placeholder="Preço">

      <button class="btn-green"
              style="width:100%"
              onclick="adicionarComida()">
        ADICIONAR
      </button>
    </div>

    <div id="listaAdminComidas"></div>

  </div>

  <!-- BEBIDAS -->
  <div id="abaBebidas" class="hidden">

    <div class="card">
      <h3>➕ Adicionar bebida</h3>

      <input id="novaBebida"
             placeholder="Nome da bebida">

      <input id="precoBebida"
             type="number"
             step="0.01"
             placeholder="Preço">

      <button class="btn-green"
              style="width:100%"
              onclick="adicionarBebida()">
        ADICIONAR
      </button>
    </div>

    <div id="listaAdminBebidas"></div>

  </div>

  <!-- SENHA -->
  <div id="abaSenha" class="hidden">

    <div class="card">
      <h3>🔑 Alterar senha do ADM</h3>

      <input id="senhaAtual"
             type="password"
             placeholder="Senha atual">

      <input id="novaSenha"
             type="password"
             placeholder="Nova senha">

      <input id="confirmaSenha"
             type="password"
             placeholder="Confirmar nova senha">

      <button class="btn-red"
              style="width:100%"
              onclick="alterarSenha()">
        ALTERAR SENHA
      </button>
    </div>

  </div>

</div>

<script>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const WHATSAPP = "5521974967664";

/*
  Senha inicial do painel ADM:
  1234

  Depois você pode alterar dentro do próprio painel.
*/

let senhaADM = localStorage.getItem("senhaADM") || "1234";


/* =====================================================
   CARDÁPIO PADRÃO
===================================================== */

let comidas = JSON.parse(
  localStorage.getItem("comidas")
) || [
  {id:1,nome:"Arroz",preco:0},
  {id:2,nome:"Feijão",preco:0},
  {id:3,nome:"Frango",preco:0},
  {id:4,nome:"Carne",preco:0}
];

let bebidas = JSON.parse(
  localStorage.getItem("bebidas")
) || [
  {id:1,nome:"Coca-Cola 2L",preco:15},
  {id:2,nome:"Fanta Laranja 2L",preco:12},
  {id:3,nome:"Tobi 2L",preco:7},
  {id:4,nome:"Coca-Cola Lata",preco:6},
  {id:5,nome:"Guaraná Antarctica Lata",preco:6},
  {id:6,nome:"Fanta Laranja Lata",preco:6},
  {id:7,nome:"Coca-Cola 600ml",preco:8},
  {id:8,nome:"Activ Plus Uva",preco:0}
];


/* =====================================================
   SALVAR
===================================================== */

function salvar(){

  localStorage.setItem(
    "comidas",
    JSON.stringify(comidas)
  );

  localStorage.setItem(
    "bebidas",
    JSON.stringify(bebidas)
  );

}


/* =====================================================
   FORMATAÇÃO
===================================================== */

function dinheiro(valor){
  return Number(valor || 0)
    .toFixed(2)
    .replace(".",",");
}


/* =====================================================
   TELA INICIAL
===================================================== */

function carregarCardapio(){

  const div = document.getElementById("cardapio");

  div.innerHTML = "";

  comidas.forEach(item => {

    div.innerHTML += `
      <div class="card">
        <div class="item">
          <div class="item-info">
            <strong>${escapeHTML(item.nome)}</strong>
            ${
              item.preco > 0
              ? `<div class="price">R$ ${dinheiro(item.preco)}</div>`
              : `<div class="small">Incluído na quentinha</div>`
            }
          </div>
        </div>
      </div>
    `;

  });

}


/* =====================================================
   PEDIDO
===================================================== */

let pedidoComidas = {};
let pedidoBebidas = {};


function abrirPedido(){

  document.getElementById("inicio")
    .classList.add("hidden");

  document.getElementById("pedido")
    .classList.remove("hidden");

  pedidoComidas = {};
  pedidoBebidas = {};

  carregarComidasPedido();
  carregarBebidasPedido();

  calcularTotal();

}


function carregarComidasPedido(){

  const div = document.getElementById("comidasPedido");

  div.innerHTML = "";

  comidas.forEach(item => {

    pedidoComidas[item.id] =
      pedidoComidas[item.id] || 0;

    div.innerHTML += `
      <div class="card">
        <div class="item">

          <div class="item-info">
            <strong>${escapeHTML(item.nome)}</strong>
            ${
              item.preco > 0
              ? `<div class="price">R$ ${dinheiro(item.preco)}</div>`
              : ""
            }
          </div>

          <div class="qty">
            <button onclick="alterarComida(${item.id},-1)">−</button>

            <span id="cq${item.id}">
              ${pedidoComidas[item.id]}
            </span>

            <button onclick="alterarComida(${item.id},1)">+</button>
          </div>

        </div>
      </div>
    `;

  });

}


function carregarBebidasPedido(){

  const div = document.getElementById("bebidasPedido");

  div.innerHTML = "";

  bebidas.forEach(item => {

    pedidoBebidas[item.id] =
      pedidoBebidas[item.id] || 0;

    div.innerHTML += `
      <div class="card">
        <div class="item">

          <div class="item-info">
            <strong>${escapeHTML(item.nome)}</strong>
            <div class="price">
              R$ ${dinheiro(item.preco)}
            </div>
          </div>

          <div class="qty">
            <button onclick="alterarBebida(${item.id},-1)">−</button>

            <span id="bq${item.id}">
              ${pedidoBebidas[item.id]}
            </span>

            <button onclick="alterarBebida(${item.id},1)">+</button>
          </div>

        </div>
      </div>
    `;

  });

}


function alterarComida(id,valor){

  pedidoComidas[id] =
    Math.max(
      0,
      (pedidoComidas[id] || 0) + valor
    );

  document.getElementById("cq"+id)
    .innerText = pedidoComidas[id];

  calcularTotal();

}


function alterarBebida(id,valor){

  pedidoBebidas[id] =
    Math.max(
      0,
      (pedidoBebidas[id] || 0) + valor
    );

  document.getElementById("bq"+id)
    .innerText = pedidoBebidas[id];

  calcularTotal();

}


/* =====================================================
   TOTAL
===================================================== */

function calcularTotal(){

  let total = 0;

  const tamanho =
    document.getElementById("tamanho").value;

  const quantidade =
    Number(document.getElementById("qtdQuentinha").value || 0);

  if(tamanho === "Quentinha Grande")
    total += 21 * quantidade;

  if(tamanho === "Quentinha Pequena")
    total += 18 * quantidade;

  if(tamanho === "Promoção")
    total += 10 * quantidade;


  comidas.forEach(item => {

    total +=
      (pedidoComidas[item.id] || 0)
      * Number(item.preco || 0);

  });


  bebidas.forEach(item => {

    total +=
      (pedidoBebidas[item.id] || 0)
      * Number(item.preco || 0);

  });


  document.getElementById("total")
    .innerText = dinheiro(total);

  return total;

}


document.getElementById("tamanho")
  .addEventListener("change", calcularTotal);

document.getElementById("qtdQuentinha")
  .addEventListener("input", calcularTotal);


/* =====================================================
   FINALIZAR PEDIDO
===================================================== */

function finalizarPedido(){

  const nome =
    document.getElementById("nome").value.trim();

  const endereco =
    document.getElementById("endereco").value.trim();

  const referencia =
    document.getElementById("referencia").value.trim();

  const pagamento =
    document.getElementById("pagamento").value;

  const troco =
    document.getElementById("troco").value.trim();

  const observacao =
    document.getElementById("observacao").value.trim();

  const tamanho =
    document.getElementById("tamanho").value;

  const quantidade =
    Number(document.getElementById("qtdQuentinha").value || 0);


  if(!nome){
    alert("Digite seu nome.");
    return;
  }

  if(!endereco){
    alert("Digite seu endereço.");
    return;
  }

  if(!tamanho){
    alert("Escolha o tamanho da quentinha.");
    return;
  }

  if(!pagamento){
    alert("Escolha a forma de pagamento.");
    return;
  }

  let texto =
`🍱 *NOVO PEDIDO*

👤 *Cliente:* ${nome}

📍 *Endereço:* ${endereco}`;

  if(referencia)
    texto += `\n📌 *Referência:* ${referencia}`;

  texto += `

🍱 *QUENTINHAS*
${quantidade}x ${tamanho}`;

  let temComida = false;

  comidas.forEach(item => {

    const qtd =
      pedidoComidas[item.id] || 0;

    if(qtd > 0){

      if(!temComida){
        texto += `\n\n🍛 *COMIDAS*`;
        temComida = true;
      }

      texto +=
        `\n${qtd}x ${item.nome}`;

    }

  });


  let temBebida = false;

  bebidas.forEach(item => {

    const qtd =
      pedidoBebidas[item.id] || 0;

    if(qtd > 0){

      if(!temBebida){
        texto += `\n\n🥤 *BEBIDAS*`;
        temBebida = true;
      }

      texto +=
        `\n${qtd}x ${item.nome} - R$ ${dinheiro(item.preco * qtd)}`;

    }

  });


  texto += `

💳 *Pagamento:* ${pagamento}`;

  if(pagamento === "Dinheiro" && troco)
    texto += `\n💵 *Troco para:* R$ ${troco}`;

  if(observacao)
    texto += `\n📝 *Observação:* ${observacao}`;

  texto += `

💰 *TOTAL: R$ ${dinheiro(calcularTotal())}*`;

  texto += `

✅ *PEDIDO CONFIRMADO PELO CARDÁPIO*`;


  const url =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(texto);

  window.location.href = url;

}


/* =====================================================
   LOGIN ADM
===================================================== */

function abrirLogin(){

  esconderTudo();

  document.getElementById("login")
    .classList.remove("hidden");

}


function entrarAdmin(){

  const senha =
    document.getElementById("senhaLogin").value;

  if(senha !== senhaADM){

    alert("Senha incorreta.");
    return;

  }

  esconderTudo();

  document.getElementById("admin")
    .classList.remove("hidden");

  carregarAdmin();

}


/* =====================================================
   ADMIN
===================================================== */

function carregarAdmin(){

  carregarAdminComidas();
  carregarAdminBebidas();

}


function carregarAdminComidas(){

  const div =
    document.getElementById("listaAdminComidas");

  div.innerHTML =
    "<h3>🍛 Comidas cadastradas</h3>";

  comidas.forEach(item => {

    div.innerHTML += `
      <div class="card">

        <input
          id="nomeC${item.id}"
          value="${escapeAttr(item.nome)}">

        <input
          id="precoC${item.id}"
          type="number"
          step="0.01"
          value="${item.preco}">

        <button
          class="btn-green"
          onclick="salvarComida(${item.id})">
          💾 SALVAR
        </button>

        <button
          class="danger"
          onclick="excluirComida(${item.id})">
          🗑️ EXCLUIR
        </button>

      </div>
    `;

  });

}


function carregarAdminBebidas(){

  const div =
    document.getElementById("listaAdminBebidas");

  div.innerHTML =
    "<h3>🥤 Bebidas cadastradas</h3>";

  bebidas.forEach(item => {

    div.innerHTML += `
      <div class="card">

        <input
          id="nomeB${item.id}"
          value="${escapeAttr(item.nome)}">

        <input
          id="precoB${item.id}"
          type="number"
          step="0.01"
          value="${item.preco}">

        <button
          class="btn-green"
          onclick="salvarBebida(${item.id})">
          💾 SALVAR
        </button>

        <button
          class="danger"
          onclick="excluirBebida(${item.id})">
          🗑️ EXCLUIR
        </button>

      </div>
    `;

  });

}


/* =====================================================
   ADICIONAR COMIDA
===================================================== */

function adicionarComida(){

  const nome =
    document.getElementById("novoNome")
      .value.trim();

  const preco =
    Number(
      document.getElementById("novoPreco").value
    );


  if(!nome){
    alert("Digite o nome da comida.");
    return;
  }

  comidas.push({
    id:Date.now(),
    nome:nome,
    preco:preco
  });

  salvar();

  document.getElementById("novoNome").value="";
  document.getElementById("novoPreco").value="";

  carregarAdminComidas();
  carregarCardapio();

}


/* =====================================================
   SALVAR COMIDA
===================================================== */

function salvarComida(id){

  const item =
    comidas.find(x => x.id === id);

  item.nome =
    document.getElementById("nomeC"+id).value;

  item.preco =
    Number(
      document.getElementById("precoC"+id).value
    );

  salvar();

  carregarAdminComidas();
  carregarCardapio();

  alert("Comida atualizada!");

}


/* =====================================================
   EXCLUIR COMIDA
===================================================== */

function excluirComida(id){

  if(!confirm("Excluir esta comida?"))
    return;

  comidas =
    comidas.filter(x => x.id !== id);

  salvar();

  carregarAdminComidas();
  carregarCardapio();

}


/* =====================================================
   ADICIONAR BEBIDA
===================================================== */

function adicionarBebida(){

  const nome =
    document.getElementById("novaBebida")
      .value.trim();

  const preco =
    Number(
      document.getElementById("precoBebida").value
    );


  if(!nome){
    alert("Digite o nome da bebida.");
    return;
  }

  bebidas.push({
    id:Date.now(),
    nome:nome,
    preco:preco
  });

  salvar();

  document.getElementById("novaBebida").value="";
  document.getElementById("precoBebida").value="";

  carregarAdminBebidas();

}


/* =====================================================
   SALVAR BEBIDA
===================================================== */

function salvarBebida(id){

  const item =
    bebidas.find(x => x.id === id);

  item.nome =
    document.getElementById("nomeB"+id).value;

  item.preco =
    Number(
      document.getElementById("precoB"+id).value
    );

  salvar();

  carregarAdminBebidas();

  alert("Bebida atualizada!");

}


/* =====================================================
   EXCLUIR BEBIDA
===================================================== */

function excluirBebida(id){

  if(!confirm("Excluir esta bebida?"))
    return;

  bebidas =
    bebidas.filter(x => x.id !== id);

  salvar();

  carregarAdminBebidas();

}


/* =====================================================
   ALTERAR SENHA
=================================
