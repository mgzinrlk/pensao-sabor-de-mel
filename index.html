<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pensão Sabor de Mel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<img src="logo.png" class="logo">
<h1>Pensão Sabor de Mel</h1>
<p>Cardápio de hoje 👇</p>
</header>

<section>
<h2>🍱 Quentinhas</h2>
<div class="produto">
<h3>Quentinha Pequena</h3>
<p>R$ 18,00</p>
<button onclick="add('Quentinha Pequena')">Adicionar pedido</button>
</div>

<div class="produto">
<h3>Quentinha Grande</h3>
<p>R$ 21,00</p>
<button onclick="add('Quentinha Grande')">Adicionar pedido</button>
</div>

<h2>🍛 Comidas</h2>
<div id="comidas"></div>

<h2>🥤 Bebidas</h2>
<div id="bebidas"></div>
</section>

<section class="pedido">
<h2>Pedido</h2>
<ul id="lista"></ul>
<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="endereco" placeholder="Endereço">

<select id="pagamento">
<option>Pix</option>
<option>Dinheiro</option>
<option>Cartão</option>
</select>

<button onclick="finalizar()">Enviar pedido</button>
</section>

<script src="banco.js"></script>
<script src="script.js"></script>
</body>
</html>
